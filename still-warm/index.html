<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>温热 — Still Warm · Gem Lee</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicAlbum",
  "name": "温热 — Still Warm",
  "byArtist": { "@type": "MusicGroup", "name": "Gem Lee" },
  "genre": "Acoustic Instrumental",
  "license": "https://creativecommons.org/licenses/by-nc-nd/4.0/",
  "copyrightYear": "2026",
  "copyrightHolder": { "@type": "Person", "name": "Gem Lee", "email": "nongming66@gmail.com" }
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @keyframes sway {
    0%,100% { transform: rotate(-0.4deg) scale(1.02); }
    50%     { transform: rotate(0.4deg)  scale(1.02); }
  }

  body {
    background: #0c0806;
    color: #f0e0c0;
    font-family: 'Georgia', 'STSong', serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .bg-image {
    position: fixed;
    inset: -6%;
    z-index: 0;
    background-image: url('https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/still-warm-cover.png');
    background-size: cover;
    background-position: center center;
    animation: sway 10s ease-in-out infinite;
    transform-origin: bottom center;
    pointer-events: none;
  }

  .bg-overlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: rgba(8, 4, 2, 0.72);
    pointer-events: none;
  }

  .back-link {
    position: fixed; top: 18px; right: 22px; z-index: 10;
    font-size: 9px; letter-spacing: 0.22em;
    color: #c8882a; text-decoration: none; text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
    transition: color 0.2s;
  }
  .back-link:hover { color: #ffffff; }

  .header { padding: 22px 40px 18px; flex-shrink: 0; position: relative; z-index: 1; }
  .album-title { font-size: 26px; font-weight: normal; letter-spacing: 0.12em; color: #ffffff; text-shadow: 0 1px 12px rgba(0,0,0,0.95); }
  .album-subtitle { font-size: 12px; color: #c8882a; margin-top: 5px; letter-spacing: 0.1em; text-shadow: 0 1px 8px rgba(0,0,0,0.9); }

  .body { display: flex; flex: 1; overflow: hidden; position: relative; z-index: 1; }

  .sidebar { width: 230px; overflow-y: auto; flex-shrink: 0; padding: 12px 0; }
  .track-item { padding: 8px 20px; cursor: pointer; transition: opacity 0.2s; }
  .track-item:hover { opacity: 0.7; }
  .track-num { font-size: 9px; letter-spacing: 0.2em; color: #c8882a; margin-bottom: 3px; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .track-zh { font-size: 13px; color: #ffffff; margin-bottom: 2px; text-shadow: 0 1px 8px rgba(0,0,0,0.95); }
  .track-en { font-size: 10px; color: #a07840; letter-spacing: 0.06em; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .track-item.active .track-zh { color: #ffd890; }
  .track-item.active .track-en { color: #c8882a; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 36px 52px 28px; }
  .now-playing { flex: 1; overflow-y: auto; }
  .np-number { font-size: 10px; letter-spacing: 0.35em; color: #c8882a; margin-bottom: 12px; text-shadow: 0 1px 8px rgba(0,0,0,0.9); }
  .np-zh { font-size: 48px; font-weight: normal; letter-spacing: 0.08em; color: #ffffff; margin-bottom: 8px; line-height: 1.1; text-shadow: 0 2px 16px rgba(0,0,0,0.95); }
  .np-en { font-size: 12px; letter-spacing: 0.28em; color: #c8882a; text-transform: uppercase; margin-bottom: 28px; text-shadow: 0 1px 10px rgba(0,0,0,0.95); }
  .np-story { font-size: 14px; line-height: 2.1; color: #d8c8a0; max-width: 500px; transition: opacity 0.4s ease; text-shadow: 0 1px 10px rgba(0,0,0,0.95); }

  .controls { flex-shrink: 0; padding-top: 22px; position: relative; z-index: 1; }
  .progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .time { font-size: 10px; letter-spacing: 0.12em; color: #c8882a; width: 36px; flex-shrink: 0; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .time.right { text-align: right; }
  .progress-bar { flex: 1; height: 1px; background: rgba(200,136,42,0.30); cursor: pointer; }
  .progress-fill { height: 100%; background: #c8882a; width: 0%; transition: width 0.25s linear; }
  .buttons { display: flex; align-items: center; gap: 20px; }
  .btn { background: none; border: none; color: #c8882a; cursor: pointer; font-size: 11px; letter-spacing: 0.18em; padding: 4px 0; transition: color 0.2s; font-family: inherit; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .btn:hover { color: #ffffff; }
  .btn-play { font-size: 14px; color: #ffffff; border: 1px solid rgba(200,136,42,0.5); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .btn-play:hover { border-color: #c8882a; color: #c8882a; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #c8882a; opacity: 0; transition: opacity 0.3s; margin-left: auto; }
  .status-dot.playing { opacity: 1; }

  .footer { text-align: center; font-size: 9px; color: #705030; letter-spacing: 0.1em; padding: 7px 20px 12px; flex-shrink: 0; line-height: 2.2; position: relative; z-index: 1; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .footer a { color: #705030; text-decoration: none; }
  .footer .wangu { font-family: 'STSong','SimSun',serif; font-size: 11px; letter-spacing: 0.2em; color: #c09060; display: block; margin-bottom: 2px; }

  @media (max-width: 768px) {
    body { height: auto; min-height: 100dvh; overflow: auto; }
    .header { padding: 16px 20px 12px; }
    .album-title { font-size: 20px; }
    .body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; display: flex; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 6px 0; flex-shrink: 0; -webkit-overflow-scrolling: touch; }
    .track-item { flex-shrink: 0; padding: 8px 16px; }
    .track-en { display: none; }
    .main { padding: 24px 20px 16px; }
    .np-zh { font-size: 32px; }
    .np-en { font-size: 10px; margin-bottom: 18px; }
    .np-story { font-size: 13px; max-width: 100%; }
    .footer { font-size: 8px; }
  }
</style>
</head>
<body>

<div class="bg-image"></div>
<div class="bg-overlay"></div>
<a class="back-link" href="../">← HUB</a>

<div class="header">
  <div class="album-title">温热 &nbsp;·&nbsp; Still Warm</div>
  <div class="album-subtitle">Gem Lee &nbsp;&nbsp;·&nbsp;&nbsp; Post-Resonance & Aftermath &nbsp;&nbsp;·&nbsp;&nbsp; 2026</div>
</div>

<div class="body">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="now-playing">
      <div class="np-number" id="npNum">TRACK 01</div>
      <div class="np-zh" id="npZh">瞬0</div>
      <div class="np-en" id="npEn">Between Two Breaths</div>
      <div class="np-story" id="npStory"></div>
    </div>
    <div class="controls">
      <div class="progress-wrap">
        <span class="time" id="timeElapsed">0:00</span>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="time right" id="timeTotal">0:00</span>
        <div class="status-dot" id="statusDot"></div>
      </div>
      <div class="buttons">
        <button class="btn" onclick="prevTrack()">&#9664;&#9664; PREV</button>
        <button class="btn btn-play" id="btnPlay" onclick="togglePlay()">&#9654;</button>
        <button class="btn" onclick="nextTrack()">NEXT &#9654;&#9654;</button>
        <button class="btn" id="btnLoop" onclick="toggleLoop()" style="margin-left:12px; opacity:0.4;">&#8635; LOOP</button>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <span class="wangu">万古长空，一朝风月.</span>

  Commercial use: <a href="mailto:nongming66@gmail.com">nongming66@gmail.com</a>
  &nbsp;&middot;&nbsp; Fees donated to Dharma Drum Mountain (法鼓山)
</div>

<audio id="audio"></audio>
<script>
const BASE='https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/';
const tracks = [
  { num:"01", zh:"瞬0", en:"Between Two Breaths",
    file:BASE+"Between_Two_Breaths.mp3",
    story:"The gap between exhale and inhale. No attack, no direction. The world before anything enters it — pure suspension, waiting at its own frequency." },
  { num:"02", zh:"孤立", en:"Notes from a Silent Room",
    file:BASE+"Notes_from_a_Silent_Room.mp3",
    story:"A single note drops into silence. The wood resonates long after the string stops. In a room quiet enough, the smallest thing casts the longest shadow." },
  { num:"03", zh:"反射", en:"A Late Night Parlor",
    file:BASE+"A_Late_Night_Parlor.mp3",
    story:"Somewhere a room still holds the warmth of the day. Low timber, a fire settling into embers, 2.2 seconds of reverb tracing the walls. You are no longer alone in the dark." },
  { num:"04", zh:"互阻", en:"Midnight Conversations",
    file:BASE+"Midnight_Conversations.mp3",
    story:"Two presences, left and right, exchanging weight. Neither leads. The pauses carry as much as the words. Somewhere in the rubato, the distance between them closes." },
  { num:"05", zh:"锁频", en:"After the Last Word",
    file:BASE+"After_the_Last_Word.mp3",
    story:"The sentence ended. The high frequencies disappeared within five seconds — everything above a conversation's register, gone. What remains is only what was always underneath: low, slow, immovable." },
  { num:"06", zh:"饱和", en:"Mahogany Hour",
    file:BASE+"Mahogany_Hour.mp3",
    story:"The heaviest point. The wood holds you the way something very dense holds everything — completely, without asking. The question is not spoken here. It is only felt." },
  { num:"07", zh:"瞬V", en:"Salt in the Wood",
    file:BASE+"Salt_in_the_Wood.mp3",
    story:"After the weight: friction. Coarse grain, rough surfaces, the texture of waking up after something. Clarity has edges. This is what being present feels like — not comfortable, but real." },
  { num:"08", zh:"V型", en:"After the Rain",
    file:BASE+"After_the_Rain.mp3",
    story:"The spectrum cleared into a V. Everything muddy in the middle drained away. The walls opened — left, right, wide and cool. The air changed. Something did leave." },
  { num:"09", zh:"衰减", en:"After the Last Toast",
    file:BASE+"After_the_Last_Toast.mp3",
    story:"The felt damper lowered. The attack went soft, the metal gone from it. The warmth of the room is still real — but it is no longer rising. Only descending, slowly, evenly, with some dignity." },
];

let current=0;
let loopAll=false;
const audio=document.getElementById('audio');

function fmt(s){if(isNaN(s))return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}

function buildSidebar(){
  const sb=document.getElementById('sidebar');
  tracks.forEach((t,i)=>{
    const el=document.createElement('div');
    el.className='track-item'+(i===0?' active':'');
    el.id='ti'+i;
    el.innerHTML=`<div class="track-num">TRACK ${t.num}</div><div class="track-zh">${t.zh}</div><div class="track-en">${t.en}</div>`;
    el.onclick=()=>loadTrack(i,true);
    sb.appendChild(el);
  });
}

function loadTrack(idx,play){
  document.getElementById('ti'+current).classList.remove('active');
  current=idx;
  document.getElementById('ti'+current).classList.add('active');
  const t=tracks[current];
  document.getElementById('npNum').textContent='TRACK '+t.num;
  document.getElementById('npZh').textContent=t.zh;
  document.getElementById('npEn').textContent=t.en;
  const s=document.getElementById('npStory');
  s.style.opacity=0;
  setTimeout(()=>{s.textContent=t.story;s.style.opacity=1;},200);
  audio.src=t.file;
  if(play)audio.play();
  updateBtn();
}

function togglePlay(){audio.paused?audio.play():audio.pause();updateBtn();}
function updateBtn(){
  document.getElementById('btnPlay').innerHTML=audio.paused?'&#9654;':'&#9646;&#9646;';
  document.getElementById('statusDot').className='status-dot'+(audio.paused?'':' playing');
}
function prevTrack(){if(audio.currentTime>3){audio.currentTime=0;return;}loadTrack((current-1+tracks.length)%tracks.length,!audio.paused);}
function nextTrack(){loadTrack((current+1)%tracks.length,!audio.paused);}

audio.addEventListener('timeupdate',()=>{
  if(!audio.duration)return;
  document.getElementById('progressFill').style.width=(audio.currentTime/audio.duration*100)+'%';
  document.getElementById('timeElapsed').textContent=fmt(audio.currentTime);
  document.getElementById('timeTotal').textContent=fmt(audio.duration);
});
audio.addEventListener('ended',()=>{if(current<tracks.length-1)loadTrack(current+1,true);else if(loopAll)loadTrack(0,true);else updateBtn();});
function toggleLoop(){loopAll=!loopAll;document.getElementById('btnLoop').style.opacity=loopAll?'1':'0.4';document.getElementById('btnLoop').style.color=loopAll?'#ffffff':'#c8882a';}
audio.addEventListener('play',updateBtn);
audio.addEventListener('pause',updateBtn);
document.getElementById('progressBar').addEventListener('click',e=>{
  if(!audio.duration)return;
  const r=e.currentTarget.getBoundingClientRect();
  audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
});

buildSidebar();
loadTrack(0,false);
</script>
</body>
</html>
