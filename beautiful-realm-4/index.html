<script>
const BASE='https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/';
const tracks = [
  { num:"01", zh:"佛像的旅行", en:"法隆寺柱子",
    file:BASE+encodeURIComponent("01_佛像的旅行.mp3"),
    story:"<p>法隆寺，是我最心仪的寺庙。它不对称的布局，古朴的金堂，都让我印象很深。但最有意思的是那些柱子。我常觉得，它们在讲佛像和佛教怎样在时间与空间里一路传开：从希腊、印度到犍陀罗，经过中国、朝鲜半岛，再到日本。这是一次怎样的旅行，想起来，心向往之。</p><p lang=\"ja\">法隆寺は、私がいちばん好きなお寺だ。左右対称ではない伽藍の配置、古びた味わいの金堂が、強く印象に残っている。けれど、いちばん面白いのは柱だと思う。柱は、仏像と仏教が時間と空間のなかをどう伝わっていったかを、語りかけてくるように見える。ギリシャ、インドからガンダーラへ、中国、朝鮮半島を経て、日本へ。それはどんな旅だったのだろう。思うたびに、心がそちらへ向かっていく。</p><p lang=\"en\" class=\"en\">A gently walking arpeggio, and one short melody that keeps coming back in different colours. A journey, not an arrival.</p>" },
  { num:"02", zh:"回首阿弥陀", en:"永观堂，京都",
    file:BASE+encodeURIComponent("02_回首阿弥陀.mp3"),
    story:"<p>永观堂的这尊阿弥陀佛并不大，却让我感动，站了很久，不愿离开。他好像真的回过头来，对大家说：“永观，迟了。”佛法的慈悲，在这一尊木像里，被表达得尽善尽美。这是我个人最喜欢的一尊佛像。</p><p lang=\"ja\">永観堂の阿弥陀如来は大きくない。それなのに心を動かされ、長いあいだ立ち尽くして、離れがたかった。本当に振り返って、皆に「永観、おそし」と語りかけているように見える。仏法の慈悲が、この一体の木像のなかに、これ以上なく見事に表されている。私がいちばん好きな仏像だ。</p><p lang=\"en\" class=\"en\">Guitar and piano, close and clear. The melody reaches up to a note that is left hanging — waiting — and then comes down slowly. The piece ends on the waiting note rather than resolving.</p>" },
  { num:"03", zh:"阿修罗", en:"兴福寺，奈良",
    file:BASE+encodeURIComponent("03_阿修罗.mp3"),
    story:"<p>我常想，那是一位什么样的雕像师。他雕阿修罗的时候，是不是心念一动，把一位三头六臂、嗔念很重的战神，雕成了现在的样子：端正，美丽，虔诚，专注地倾听，怒气已经平下来。这中间是怎样的一个过程？想起来，让人浮想联翩。</p><p lang=\"ja\">あの像をつくった仏師は、どんな人だったのだろう、とよく思う。阿修羅を彫るとき、ふと心が動いたのだろうか。三つの顔と六本の腕をもつ、嗔りの念の強い戦いの神を、いまの姿に彫り上げた。端正で、美しく、敬虔で、集中して耳を傾け、怒りはもう静まっている。そのあいだには、どんな過程があったのだろう。思いは尽きない。</p><p lang=\"en\" class=\"en\">A single nylon-string guitar, one line, unhurried. Near the middle one brief high note rings out — what Lee hears as a trace of old anger — and the music returns to its quiet.</p>" },
  { num:"04", zh:"药师三尊", en:"药师寺，奈良",
    file:BASE+encodeURIComponent("04_药师三尊.mp3"),
    story:"<p>药师三尊，我总觉得有一种神秘。那样的面容，那样的身体，在那么早的年代就雕出来了，很难想象。他想表达的是什么？像一个谜，静静地站在那里。</p><p lang=\"ja\">薬師三尊には、いつも神秘を感じる。あの顔、あの体が、あれほど古い時代に彫られたとは、想像しにくい。何を表そうとしたのだろう。謎のように、静かにそこに立っている。</p><p lang=\"en\" class=\"en\">Guitar and piano with open, spacious chords. The melody is clearer than in the other pieces; Lee hears it as the central figure, with the two softer ones on either side.</p>" },
  { num:"05", zh:"半跏思惟像", en:"中宫寺，奈良",
    file:BASE+encodeURIComponent("05_半跏思惟像.mp3"),
    story:"<p>这也是一尊让我着迷的像。他静静地听，静静地想，静静地冥想。不论人们说他是如意轮观音，还是弥勒，这都是一件流传下来的杰作。</p><p lang=\"ja\">これも、私を惹きつけてやまない像だ。静かに耳を傾け、静かに思い、静かに瞑想している。如意輪観音とも弥勒ともいわれるが、いずれにしても、後世に伝わる傑作に変わりはない。</p><p lang=\"en\" class=\"en\">A slow solo piano piece with a gently rocking pulse. The melody waits at the end of each phrase before it goes on.</p>" },
  { num:"06", zh:"金刚力士", en:"东大寺南大门，奈良",
    file:BASE+encodeURIComponent("06_金刚力士.mp3"),
    story:"<p>东大寺南大门的这两尊金刚力士，让我第一次想到：是谁创造了这些佛像？他们是怎样把灵魂放进去的？我向他们顶礼。</p><p lang=\"ja\">東大寺南大門の二体の金剛力士像は、「これをつくったのは誰なのか」と、私に初めて考えさせた。彼らは、どのようにして魂を込めたのだろう。深く礼拝する。</p><p lang=\"en\" class=\"en\">The one electronic piece, and it is about the makers rather than the statue. A small repeating rhythmic cell — one firm stroke, three soft ones — under a clear, upright melody. It moves with steady energy, not with volume.</p>" },
  { num:"07", zh:"卢舍那佛", en:"东大寺，奈良",
    file:BASE+encodeURIComponent("07_卢舍那佛.mp3"),
    story:"<p>那是一座让人震撼的木结构大殿，里面更是让人震撼的卢舍那佛。站在他面前，我反而更容易放下自我；可同时，又觉得内心无比巨大。</p><p lang=\"ja\">圧倒される木造の大殿、そのなかには、さらに圧倒される盧舎那仏がいる。その前に立つと、私はかえって自分を手放しやすくなる。同時に、心のなかが限りなく大きくなる。</p><p lang=\"en\" class=\"en\">Solo piano, slow and spacious. The sense of size comes from the room, not from volume; nothing swells. This is the one piece in which the melody is allowed to rise a little.</p>" },
  { num:"08", zh:"金刚波罗蜜菩萨", en:"东寺，京都",
    file:BASE+encodeURIComponent("08_金刚波罗蜜菩萨.mp3"),
    story:"<p>东寺讲堂里，有二十一尊佛像组成的立体曼荼罗，每一尊都是杰作。但中间的这位金刚波罗蜜菩萨，我看了很久。说不出为什么，总觉得她和其他的有些不同，更有人情味。她让我莫名其妙地想起在日本遇到的几位女旅店主：自信，放松，安静。</p><p lang=\"ja\">東寺の講堂には、二十一体の仏像による立体曼荼羅がある。どれも傑作だ。けれど、その中央にいる金剛波羅蜜菩薩を、私は長いあいだ見ていた。なぜかは分からない。ほかの像とどこか違い、人間味がある。日本で出会った何人かの旅館の女将さんを、ふと思い出した。自信があり、くつろいで、静かな人たちだ。</p><p lang=\"en\" class=\"en\">Nylon-string guitar, relaxed and assured, in a warm major key, with a very light piano. One central note keeps returning, with softer notes gathered around it.</p>" },
  { num:"09", zh:"不动明王", en:"成田山新胜寺，成田",
    file:BASE+encodeURIComponent("09_不动明王.mp3"),
    story:"<p>成田，每天有成千上万的人来来往往，这里却安放着不动明王。我因此想起《六祖坛经》里风动、幡动、心动的故事：不是风动，不是幡动，是仁者心动。他满头是火，怒目而视，看上去在动，却在动中不动，像悬浮在那里。</p><p lang=\"ja\">成田では、毎日何千何万という人が行き交っている。それなのに、ここには不動明王が安置されている。『六祖壇経』の、風が動くのか、幡が動くのか、心が動くのか、という話を思い出した。風が動くのでも、幡が動くのでもない。仁者の心が動くのだ。頭上いっぱいに炎を負い、怒りの眼で見据えている。動いているようで、動きのなかで動かない。宙に浮かんでいるように見える。</p><p lang=\"en\" class=\"en\">A flowing guitar figure — the world in motion — with calm piano notes held above it. Everything moves except the one thing that stays.</p>" },
  { num:"10", zh:"千手观音", en:"三十三间堂，京都",
    file:BASE+encodeURIComponent("10_千手观音.mp3"),
    story:"<p>这大概是最让我震撼的佛像群。极其精美。看着它们，我对日本人的虔诚，对日本的文化，由衷敬佩。</p><p lang=\"ja\">おそらく、私がいちばん圧倒された仏像群だ。このうえなく精緻である。それを前にして、日本の人々の信仰の篤さと、日本の文化に、心から敬服する。</p><p lang=\"en\" class=\"en\">Solo piano. Rolling arpeggios from a low root, and a short melody that returns again and again, each time resting on a different note.</p>" },
];

let current=0;
let loopAll=false;
const audio=document.getElementById('audio');

function fmt(s){if(isNaN(s))return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}

function buildSidebar(){
  const sb=document.getElementById('sidebar');
  tracks.forEach((t,i)=>{
    const el=document.createElement('div');
    el.className='track-item'+(i===0?' active':'');
    el.id='ti'+i;
    el.innerHTML=`<div class="track-num">TRACK ${t.num}</div><div class="track-zh">${t.zh}</div><div class="track-en">${t.en}</div>`;
    el.onclick=()=>loadTrack(i,true);
    sb.appendChild(el);
  });
}

function loadTrack(idx,play){
  document.getElementById('ti'+current).classList.remove('active');
  current=idx;
  document.getElementById('ti'+current).classList.add('active');
  const t=tracks[current];
  document.getElementById('npNum').textContent='TRACK '+t.num;
  document.getElementById('npZh').textContent=t.zh;
  document.getElementById('npEn').textContent=t.en;
  const s=document.getElementById('npStory');
  s.style.opacity=0;
  setTimeout(()=>{s.innerHTML=t.story;s.style.opacity=1;},200);
  audio.src=t.file;
  if(play)audio.play();
  updateBtn();
}

function togglePlay(){audio.paused?audio.play():audio.pause();updateBtn();}
function updateBtn(){
  document.getElementById('btnPlay').innerHTML=audio.paused?'&#9654;':'&#9646;&#9646;';
  document.getElementById('statusDot').className='status-dot'+(audio.paused?'':' playing');
}
function prevTrack(){if(audio.currentTime>3){audio.currentTime=0;return;}loadTrack((current-1+tracks.length)%tracks.length,!audio.paused);}
function nextTrack(){loadTrack((current+1)%tracks.length,!audio.paused);}

audio.addEventListener('timeupdate',()=>{
  if(!audio.duration)return;
  document.getElementById('progressFill').style.width=(audio.currentTime/audio.duration*100)+'%';
  document.getElementById('timeElapsed').textContent=fmt(audio.currentTime);
  document.getElementById('timeTotal').textContent=fmt(audio.duration);
});
audio.addEventListener('ended',()=>{if(current<tracks.length-1)loadTrack(current+1,true);else if(loopAll)loadTrack(0,true);else updateBtn();});
function toggleLoop(){loopAll=!loopAll;document.getElementById('btnLoop').style.opacity=loopAll?'1':'0.4';document.getElementById('btnLoop').style.color=loopAll?'#ffffff':'#c8882a';}
audio.addEventListener('play',updateBtn);
audio.addEventListener('pause',updateBtn);
document.getElementById('progressBar').addEventListener('click',e=>{
  if(!audio.duration)return;
  const r=e.currentTarget.getBoundingClientRect();
  audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
});

buildSidebar();
loadTrack(0,false);
</script>
</body>
</html>
