<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日常生活微观美学 — Micro-Aesthetics of Daily Life</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicAlbum",
  "name": "日常生活微观美学 — Micro-Aesthetics of Daily Life",
  "byArtist": { "@type": "MusicGroup", "name": "Gem Lee" },
  "genre": "Ambient Folk, Lo-Fi Acoustic",
  "license": "https://creativecommons.org/licenses/by-nc-nd/4.0/",
  "copyrightYear": "2026",
  "copyrightHolder": { "@type": "Person", "name": "Gem Lee", "email": "nongming66@gmail.com" },
  "description": "Concept, lyrics, prompts and arrangement by Gem Lee. Audio synthesized via AI."
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #08100a;
    color: #ccd8b8;
    font-family: 'Georgia', 'STSong', serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    padding: 24px 40px 18px;
    border-bottom: 1px solid #182018;
    flex-shrink: 0;
  }
  .album-title { font-size: 26px; font-weight: normal; letter-spacing: 0.12em; color: #dde8c8; }
  .album-subtitle { font-size: 12px; color: #4a6038; margin-top: 5px; letter-spacing: 0.1em; }

  .body { display: flex; flex: 1; overflow: hidden; }

  .sidebar {
    width: 230px;
    border-right: 1px solid #182018;
    overflow-y: auto;
    flex-shrink: 0;
    padding: 12px 0;
  }
  .track-item {
    padding: 10px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.2s;
  }
  .track-item:hover { background: #0e1610; }
  .track-item.active { border-left-color: #7a9e68; background: #0c1410; }
  .track-num { font-size: 9px; letter-spacing: 0.2em; color: #2e3e28; margin-bottom: 3px; }
  .track-zh { font-size: 14px; color: #ccd8b8; margin-bottom: 2px; }
  .track-en { font-size: 10px; color: #3a5030; letter-spacing: 0.08em; }
  .track-item.active .track-num { color: #5a7e4a; }
  .track-item.active .track-zh { color: #dde8c8; }
  .track-item.active .track-en { color: #7a9e68; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .now-playing {
    flex: 1;
    padding: 44px 48px 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow: hidden;
  }
  .np-number { font-size: 10px; letter-spacing: 0.35em; color: #2e3e28; margin-bottom: 14px; }
  .np-zh { font-size: 40px; font-weight: normal; letter-spacing: 0.1em; color: #dde8c8; margin-bottom: 8px; line-height: 1.2; }
  .np-en { font-size: 14px; letter-spacing: 0.22em; color: #7a9e68; text-transform: uppercase; margin-bottom: 28px; }
  .np-story { font-size: 14px; line-height: 1.9; color: #4a6038; max-width: 520px; transition: opacity 0.4s ease; }

  .controls {
    padding: 20px 48px 24px;
    border-top: 1px solid #182018;
    flex-shrink: 0;
  }
  .progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .progress-bar { flex: 1; height: 2px; background: #182018; cursor: pointer; position: relative; }
  .progress-fill { height: 100%; background: #7a9e68; width: 0%; transition: width 0.25s linear; }
  .time { font-size: 10px; letter-spacing: 0.12em; color: #2e3e28; }
  .buttons { display: flex; align-items: center; gap: 16px; }
  .btn {
    background: none; border: 1px solid #182018; color: #3a5030;
    padding: 6px 18px; font-size: 10px; letter-spacing: 0.25em;
    cursor: pointer; font-family: inherit; transition: all 0.2s;
  }
  .btn:hover { border-color: #3a5030; color: #7a9e68; }
  .btn-play { border-color: #3a5030; color: #7a9e68; padding: 8px 28px; font-size: 16px; }
  .btn-play:hover { border-color: #7a9e68; color: #aacca8; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #7a9e68; opacity: 0; transition: opacity 0.3s; margin-left: auto; }
  .status-dot.playing { opacity: 1; }

  .footer {
    text-align: center;
    font-size: 9px;
    color: #2e3e28;
    letter-spacing: 0.1em;
    padding: 8px 20px 12px;
    border-top: 1px solid #182018;
    flex-shrink: 0;
    line-height: 2;
  }
  .footer a { color: #2e3e28; text-decoration: none; }
</style>
</head>
<body>
<div class="header">
  <div class="album-title">日常生活微观美学</div>
  <div class="album-subtitle">Micro-Aesthetics of Daily Life &nbsp;·&nbsp; Gem Lee &nbsp;·&nbsp; 2026</div>
</div>
<div class="body">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="now-playing">
      <div class="np-number" id="npNum">TRACK 01</div>
      <div class="np-zh" id="npZh">周二的惰性</div>
      <div class="np-en" id="npEn">Inertia of a Tuesday</div>
      <div class="np-story" id="npStory"></div>
    </div>
    <div class="controls">
      <div class="progress-wrap">
        <span class="time" id="timeElapsed">0:00</span>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="time" id="timeTotal">0:00</span>
        <div class="status-dot" id="statusDot"></div>
      </div>
      <div class="buttons">
        <button class="btn" onclick="prevTrack()">&#9664;&#9664; PREV</button>
        <button class="btn btn-play" id="btnPlay" onclick="togglePlay()">&#9654;</button>
        <button class="btn" onclick="nextTrack()">NEXT &#9654;&#9654;</button>
      </div>
    </div>
  </div>
</div>
<div class="footer">
  &copy; 2026 Gem Lee &nbsp;&middot;&nbsp; <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/" target="_blank">CC BY-NC-ND 4.0</a> &nbsp;&middot;&nbsp; Non-commercial use free with attribution &nbsp;&middot;&nbsp; Commercial use: <a href="mailto:nongming66@gmail.com">nongming66@gmail.com</a> &nbsp;&middot;&nbsp; Fees donated to Dharma Drum Mountain Seattle (法鼓山西雅图分会)
</div>
<audio id="audio"></audio>
<script>
const tracks = [
  { num:"01", zh:"周二的惰性", en:"Inertia of a Tuesday", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/Inertia_of_a_Tuesday.mp3",
    story:"The curtains stay closed even when the clock hits twelve. Dust is dancing in the one light that leaks through the frame. Stuck in the amber of a spring Tuesday — waiting for the doorbell or the phone to finally ring." },
  { num:"02", zh:"亚麻与咖啡", en:"Linen and Coffee", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/Linen_and_Coffee.mp3",
    story:"Gray horizon, condensation moving through the chill. A fern in the pot, a page turning into the gloom. Outside is mist and cold; inside is linen, coffee, and the warmth that is enough." },
  { num:"03", zh:"贝尔维尤的下午", en:"Bellevue Afternoon", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/Bellevue_Afternoon.mp3",
    story:"The Tuesday light is cutting through the glass. A 1:13 ghost that's gonna pass — before the ice in the coffee starts to melt. Just a flicker, just a shade. And then it's gone." },
  { num:"04", zh:"松针与树叶", en:"Needle and Leaf", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/Needle_and_Leaf.mp3",
    story:"Dappled gold on the forest floor. A shade of green I've not seen before. The wind is a ghost in the canopy — a cool breath from a northern sea. Caught in the green of a Seattle day." },
  { num:"05", zh:"瓷器与阳光", en:"Porcelain and Sunlight", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/Porcelain_and_Sunlight.mp3",
    story:"Two guitars in quiet conversation — one holds the warmth, one traces the light. Afternoon three-thirty. A teacup on the table, casting a golden halo. No words needed." },
  { num:"06", zh:"香杉树荫下", en:"Under the Cedar Bough", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/Under_the_Cedar_Bough.mp3",
    story:"The slowest piece. A single guitar, deep cedar resonance, the day settling into stillness. Under the bough, the earth holds you. You don't need to go anywhere else." },
];

let current=0; const audio=document.getElementById('audio');
function fmt(s){if(isNaN(s))return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
function buildSidebar(){const sb=document.getElementById('sidebar');tracks.forEach((t,i)=>{const el=document.createElement('div');el.className='track-item'+(i===0?' active':'');el.id='ti'+i;el.innerHTML=`<div class="track-num">TRACK ${t.num}</div><div class="track-zh">${t.zh}</div><div class="track-en">${t.en}</div>`;el.onclick=()=>loadTrack(i,true);sb.appendChild(el);});}
function loadTrack(idx,play){document.getElementById('ti'+current).classList.remove('active');current=idx;document.getElementById('ti'+current).classList.add('active');const t=tracks[current];document.getElementById('npNum').textContent='TRACK '+t.num;document.getElementById('npZh').textContent=t.zh;document.getElementById('npEn').textContent=t.en;const s=document.getElementById('npStory');s.style.opacity=0;setTimeout(()=>{s.textContent=t.story;s.style.opacity=1;},200);audio.src=t.file;if(play)audio.play();updateBtn();}
function togglePlay(){audio.paused?audio.play():audio.pause();updateBtn();}
function updateBtn(){document.getElementById('btnPlay').innerHTML=audio.paused?'&#9654;':'&#9646;&#9646;';document.getElementById('statusDot').className='status-dot'+(audio.paused?'':' playing');}
function prevTrack(){if(audio.currentTime>3){audio.currentTime=0;return;}loadTrack((current-1+tracks.length)%tracks.length,!audio.paused);}
function nextTrack(){loadTrack((current+1)%tracks.length,!audio.paused);}
audio.addEventListener('timeupdate',()=>{if(!audio.duration)return;document.getElementById('progressFill').style.width=(audio.currentTime/audio.duration*100)+'%';document.getElementById('timeElapsed').textContent=fmt(audio.currentTime);document.getElementById('timeTotal').textContent=fmt(audio.duration);});
audio.addEventListener('ended',()=>{if(current<tracks.length-1)loadTrack(current+1,true);else updateBtn();});
audio.addEventListener('play',updateBtn);audio.addEventListener('pause',updateBtn);
document.getElementById('progressBar').addEventListener('click',e=>{if(!audio.duration)return;const r=e.currentTarget.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;});
buildSidebar();loadTrack(0,false);
</script>
</body>
</html>
