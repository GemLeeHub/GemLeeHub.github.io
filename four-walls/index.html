<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四壁 — Four Walls</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /*
  ─────────────────────────────────────────────
  COLOR THEME — PROJECT-003 四壁 Four Walls
  Transparent UI over wallpaper — silent-friend pattern
  Accent : #d4621a  (ember orange)
  ─────────────────────────────────────────────
  */

  body {
    background: #0c0806;
    color: #d8c8b0;
    font-family: 'Georgia', 'STSong', serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .bg-image {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url('./cover.png');
    background-size: cover;
    background-position: center center;
    opacity: 1;
    pointer-events: none;
  }

  .bg-overlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: rgba(0, 0, 0, 0.22);
    pointer-events: none;
  }

  /* ── HEADER ─────────────────────────────────────────── */
  .header { padding: 22px 40px 18px; flex-shrink: 0; position: relative; z-index: 1; }
  .album-title { font-size: 26px; font-weight: normal; letter-spacing: 0.12em; color: #ffffff; text-shadow: 0 1px 12px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.6); }
  .album-subtitle { font-size: 12px; color: #d4621a; margin-top: 5px; letter-spacing: 0.1em; text-shadow: 0 1px 8px rgba(0,0,0,0.9); }

  /* ── BODY ───────────────────────────────────────────── */
  .body { display: flex; flex: 1; overflow: hidden; position: relative; z-index: 1; }

  .sidebar { width: 230px; overflow-y: auto; flex-shrink: 0; padding: 12px 0; }
  .track-item { padding: 10px 20px; cursor: pointer; transition: opacity 0.2s; }
  .track-item:hover { opacity: 0.75; }
  .track-num { font-size: 9px; letter-spacing: 0.2em; color: #d4621a; margin-bottom: 3px; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .track-zh { font-size: 14px; color: #ffffff; margin-bottom: 2px; text-shadow: 0 1px 8px rgba(0,0,0,0.95); }
  .track-en { font-size: 10px; color: #8a6040; letter-spacing: 0.08em; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .track-item.active .track-zh { color: #f5e0c0; }
  .track-item.active .track-en { color: #c09060; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 40px 50px 28px; }
  .now-playing { flex: 1; overflow-y: auto; }
  .np-number { font-size: 10px; letter-spacing: 0.35em; color: #d4621a; margin-bottom: 14px; text-shadow: 0 1px 8px rgba(0,0,0,0.9); }
  .np-zh { font-size: 48px; font-weight: normal; color: #ffffff; letter-spacing: 0.08em; line-height: 1.2; margin-bottom: 10px; text-shadow: 0 2px 16px rgba(0,0,0,0.95), 0 0 60px rgba(0,0,0,0.5); }
  .np-en { font-size: 14px; letter-spacing: 0.22em; color: #d4621a; text-transform: uppercase; margin-bottom: 28px; text-shadow: 0 1px 10px rgba(0,0,0,0.95); }
  .np-story { font-size: 14px; line-height: 1.9; color: #ccc0a8; max-width: 540px; font-style: italic; transition: opacity 0.4s ease; text-shadow: 0 1px 10px rgba(0,0,0,0.95); }

  /* ── CONTROLS ───────────────────────────────────────── */
  .controls { flex-shrink: 0; padding-top: 22px; }
  .progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .time { font-size: 10px; letter-spacing: 0.12em; color: #d4621a; width: 36px; flex-shrink: 0; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .time.right { text-align: right; }
  .progress-bar { flex: 1; height: 1px; background: rgba(212,98,26,0.3); cursor: pointer; position: relative; }
  .progress-fill { height: 100%; background: #d4621a; width: 0%; transition: width 0.25s linear; }
  .buttons { display: flex; align-items: center; gap: 16px; }
  .btn { background: none; border: none; color: #8a6040; cursor: pointer; font-size: 10px; letter-spacing: 0.25em; padding: 4px 0; font-family: inherit; transition: color 0.2s; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .btn:hover { color: #ffffff; }
  .btn-play { font-size: 16px; color: #ffffff; border: 1px solid rgba(212,98,26,0.6); border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; padding: 0; }
  .btn-play:hover { border-color: #d4621a; color: #d4621a; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #d4621a; opacity: 0; transition: opacity 0.3s; margin-left: auto; }
  .status-dot.playing { opacity: 1; }

  /* ── FOOTER ─────────────────────────────────────────── */
  .footer { text-align: center; font-size: 9px; color: #8a6040; letter-spacing: 0.1em; padding: 7px 20px 10px; flex-shrink: 0; line-height: 2; position: relative; z-index: 1; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .footer a { color: #8a6040; text-decoration: none; }
  .mantra { font-size: 11px; color: #d4621a; letter-spacing: 0.32em; font-style: italic; margin-top: 3px; text-shadow: 0 1px 10px rgba(0,0,0,0.9); }

  /* ── MOBILE ─────────────────────────────────────────── */
  @media (max-width: 768px) {
    body { height: auto; min-height: 100dvh; overflow: auto; }
    .bg-image { background-attachment: scroll; }
    .header { padding: 16px 20px 12px; }
    .album-title { font-size: 20px; }
    .album-subtitle { font-size: 10px; }
    .body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; display: flex; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 6px 0; flex-shrink: 0; -webkit-overflow-scrolling: touch; }
    .track-item { flex-shrink: 0; padding: 8px 16px; }
    .track-item.active { border-bottom: 2px solid #d4621a; }
    .track-en { display: none; }
    .main { padding: 24px 20px 16px; }
    .np-zh { font-size: 32px; }
    .np-en { font-size: 10px; letter-spacing: 0.18em; margin-bottom: 18px; }
    .np-story { font-size: 13px; }
    .controls { padding-top: 16px; }
    .btn-play { width: 44px; height: 44px; }
  }
</style>
</head>
<body>
<div class="bg-image"></div>
<div class="bg-overlay"></div>
<div class="header">
  <div class="album-title">四壁 &nbsp;·&nbsp; Four Walls</div>
  <div class="album-subtitle">Lee Jin &nbsp;·&nbsp; 2026</div>
</div>
<div class="body">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="now-playing">
      <div class="np-number" id="npNum">TRACK 01</div>
      <div class="np-zh" id="npZh">茶未凉</div>
      <div class="np-en" id="npEn">Before the Tea Cools</div>
      <div class="np-story" id="npStory"></div>
    </div>
    <div class="controls">
      <div class="progress-wrap">
        <span class="time" id="timeElapsed">0:00</span>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="time right" id="timeTotal">0:00</span>
        <div class="status-dot" id="statusDot"></div>
      </div>
      <div class="buttons">
        <button class="btn" onclick="prevTrack()">&#9664;&#9664; PREV</button>
        <button class="btn btn-play" id="btnPlay" onclick="togglePlay()">&#9654;</button>
        <button class="btn" onclick="nextTrack()">NEXT &#9654;&#9654;</button>
      </div>
    </div>
  </div>
</div>
<audio id="audio"></audio>
<script>
const tracks = [
  { num:"01", zh:"茶未凉", en:"Before the Tea Cools", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T01_%E8%8C%B6%E6%9C%AA%E5%87%89_Before_the_Tea_Cools.mp3",
    story:"Morning. The tea is still hot — just barely. No one has drunk it yet. The room is quiet with the specific quiet of early hours: unhurried, without expectation. The day has not begun. C major. The softest piece on the album." },
  { num:"02", zh:"四壁", en:"Between These Four Walls", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T02_%E5%9B%9B%E5%A3%81_Between_These_Four_Walls.mp3",
    story:"The room itself. Four walls, a ceiling, a floor — and inside them, the particular quality of being indoors: not confined, just bounded. The room as a whole world. A minor, slightly more weight than the opening. The guitar establishes that this space is complete." },
  { num:"03", zh:"阳光落地", en:"Sun on the Floorboards", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T03_%E9%98%B3%E5%85%89%E8%90%BD%E5%9C%B0_Sun_on_the_Floorboards.mp3",
    story:"Noon. Light falls directly onto the floor in a stripe that crosses from window to wall. The brightest piece on the album. G major. Something almost active in the light — not energetic, just present. The guitar is fuller here: noon has its own weight." },
  { num:"04", zh:"三点钟的重量", en:"The Weight of Three O'Clock", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T04_%E4%B8%89%E7%82%B9%E9%92%9F%E7%9A%84%E9%87%8D%E9%87%8F_The_Weight_of_Three_OClock.mp3",
    story:"Three o'clock — the hour of greatest stillness. Energy at its lowest. The light has moved past the floor. The room is quiet in a different way now — not morning quiet, which is fresh, but afternoon quiet, which has settled. The heaviest piece on the album." },
  { num:"05", zh:"四点的对话", en:"Conversations at Four", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T05_%E5%9B%9B%E7%82%B9%E7%9A%84%E5%AF%B9%E8%AF%9D_Conversations_at_Four.mp3",
    story:"Something stirs. A thought, or the memory of a voice, or simply the guitar playing to itself. It is not quite a conversation — there is only one guitar — but the phrase shapes suggest call and withdrawal, something offered and something held back." },
  { num:"06", zh:"最后的光", en:"Last Light On the Floor", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T06_%E6%9C%80%E5%90%8E%E7%9A%84%E5%85%89_Last_Light_On_The_Floor.mp3",
    story:"Evening. The light returns to the floor one last time, lower now, longer-angled, orange at the edges. Then it goes. The guitar does not chase it. The album closes without ceremony, because ordinary days do not end with ceremony. They simply end." }
];
let current=0; const audio=document.getElementById('audio');
function fmt(s){if(isNaN(s))return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
function buildSidebar(){const sb=document.getElementById('sidebar');tracks.forEach((t,i)=>{const el=document.createElement('div');el.className='track-item'+(i===0?' active':'');el.id='ti'+i;el.innerHTML=`<div class="track-num">TRACK ${t.num}</div><div class="track-zh">${t.zh}</div><div class="track-en">${t.en}</div>`;el.onclick=()=>loadTrack(i,true);sb.appendChild(el);});}
function loadTrack(idx,play){document.getElementById('ti'+current).classList.remove('active');current=idx;document.getElementById('ti'+current).classList.add('active');const t=tracks[current];document.getElementById('npNum').textContent='TRACK '+t.num;document.getElementById('npZh').textContent=t.zh;document.getElementById('npEn').textContent=t.en;const s=document.getElementById('npStory');s.style.opacity=0;setTimeout(()=>{s.textContent=t.story;s.style.opacity=1;},200);audio.src=t.file;if(play)audio.play();updateBtn();}
function togglePlay(){audio.paused?audio.play():audio.pause();updateBtn();}
function updateBtn(){document.getElementById('btnPlay').innerHTML=audio.paused?'&#9654;':'&#9646;&#9646;';document.getElementById('statusDot').className='status-dot'+(audio.paused?'':' playing');}
function prevTrack(){if(audio.currentTime>3){audio.currentTime=0;return;}loadTrack((current-1+tracks.length)%tracks.length,!audio.paused);}
function nextTrack(){loadTrack((current+1)%tracks.length,!audio.paused);}
audio.addEventListener('timeupdate',()=>{if(!audio.duration)return;document.getElementById('progressFill').style.width=(audio.currentTime/audio.duration*100)+'%';document.getElementById('timeElapsed').textContent=fmt(audio.currentTime);document.getElementById('timeTotal').textContent=fmt(audio.duration);});
audio.addEventListener('ended',()=>{if(current<tracks.length-1)loadTrack(current+1,true);else updateBtn();});
audio.addEventListener('play',updateBtn);audio.addEventListener('pause',updateBtn);
document.getElementById('progressBar').addEventListener('click',e=>{if(!audio.duration)return;const r=e.currentTarget.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;});
buildSidebar();loadTrack(0,false);
</script>

  <div class="mantra">万古长空，一朝风月</div>
</div>
</body>
</html>
