<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四壁 — Four Walls</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0c0806;
    color: #d8c8b0;
    font-family: 'Georgia', 'STSong', serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    padding: 24px 40px 18px;
    border-bottom: 1px solid #1e1208;
    flex-shrink: 0;
  }
  .album-title { font-size: 26px; font-weight: normal; letter-spacing: 0.12em; color: #ecdcc0; }
  .album-subtitle { font-size: 12px; color: #5a4030; margin-top: 5px; letter-spacing: 0.1em; }

  .body { display: flex; flex: 1; overflow: hidden; }

  .sidebar {
    width: 230px;
    border-right: 1px solid #1e1208;
    overflow-y: auto;
    flex-shrink: 0;
    padding: 12px 0;
  }
  .track-item {
    padding: 10px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.2s;
  }
  .track-item:hover { background: #180e08; }
  .track-item.active { border-left-color: #d4621a; background: #150c06; }
  .track-num { font-size: 9px; color: #5a4030; letter-spacing: 0.12em; margin-bottom: 2px; }
  .track-zh { font-size: 15px; color: #d8c8b0; letter-spacing: 0.05em; }
  .track-en { font-size: 10px; color: #5a4030; margin-top: 1px; }
  .track-item.active .track-zh { color: #d4621a; }
  .track-item.active .track-en { color: #a04c14; }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 40px 50px 30px;
  }
  .now-playing { flex: 1; overflow-y: auto; }
  .np-number { font-size: 10px; color: #5a4030; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 14px; }
  .np-zh { font-size: 50px; font-weight: normal; color: #ecdcc0; letter-spacing: 0.08em; line-height: 1; margin-bottom: 10px; }
  .np-en { font-size: 16px; color: #8a6848; letter-spacing: 0.1em; margin-bottom: 34px; }
  .np-story { font-size: 14px; line-height: 1.9; color: #9a8068; max-width: 540px; transition: opacity 0.4s ease; }

  /* Amber light accent line under story heading */
  .np-zh::after { content: ''; display: block; width: 40px; height: 2px; background: #d4621a; margin-top: 16px; opacity: 0.6; }

  .controls { flex-shrink: 0; padding-top: 26px; border-top: 1px solid #1e1208; }
  .progress-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .time { font-size: 10px; color: #5a4030; width: 38px; flex-shrink: 0; }
  .time.right { text-align: right; }
  .progress-bar { flex: 1; height: 2px; background: #1e1208; border-radius: 2px; cursor: pointer; }
  .progress-fill { height: 100%; background: #d4621a; border-radius: 2px; width: 0%; transition: width 0.5s linear; pointer-events: none; }
  .buttons { display: flex; align-items: center; gap: 26px; }
  .btn { background: none; border: none; color: #5a4030; cursor: pointer; font-size: 12px; letter-spacing: 0.1em; padding: 5px 0; transition: color 0.2s; }
  .btn:hover { color: #d4621a; }
  .btn-play { font-size: 14px; color: #d8c8b0; border: 1px solid #2e1c10; border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .btn-play:hover { border-color: #d4621a; color: #d4621a; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #d4621a; opacity: 0; transition: opacity 0.3s; margin-left: auto; }
  .status-dot.playing { opacity: 1; }
  .footer { text-align: center; font-size: 9px; color: #2a2820; letter-spacing: 0.1em; padding: 10px 0 14px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="header">
  <div class="album-title">四壁 &nbsp;·&nbsp; Four Walls</div>
  <div class="album-subtitle">Lee Jin &nbsp;&nbsp;·&nbsp;&nbsp; 2026</div>
</div>
<div class="body">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="now-playing">
      <div class="np-number" id="npNum">TRACK 01</div>
      <div class="np-zh" id="npZh">四壁</div>
      <div class="np-en" id="npEn">Between These Four Walls</div>
      <div class="np-story" id="npStory"></div>
    </div>
    <div class="controls">
      <div class="progress-wrap">
        <span class="time" id="timeElapsed">0:00</span>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="time right" id="timeTotal">0:00</span>
        <div class="status-dot" id="statusDot"></div>
      </div>
      <div class="buttons">
        <button class="btn" onclick="prevTrack()">&#9664;&#9664; PREV</button>
        <button class="btn btn-play" id="btnPlay" onclick="togglePlay()">&#9654;</button>
        <button class="btn" onclick="nextTrack()">NEXT &#9654;&#9654;</button>
      </div>
    </div>
  </div>
</div>
<audio id="audio"></audio>
<script>
const tracks = [
  { num:"01", zh:"四壁", en:"Between These Four Walls", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T02_%E5%9B%9B%E5%A3%81_Between_These_Four_Walls.mp3",
    story:"The room itself. Four walls, a ceiling, a floor — and inside them, the particular quality of being indoors: not confined, just bounded. The room as a whole world. A minor, slightly more weight than the opening. The guitar establishes that this space is complete." },
  { num:"02", zh:"阳光落地", en:"Sun on the Floorboards", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T03_%E9%98%B3%E5%85%89%E8%90%BD%E5%9C%B0_Sun_on_the_Floorboards.mp3",
    story:"Noon. Light falls directly onto the floor in a stripe that crosses from window to wall. The brightest piece on the album. G major. Something almost active in the light — not energetic, just present. The guitar is fuller here: noon has its own weight." },
  { num:"03", zh:"三点钟的重量", en:"The Weight of Three O'Clock", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T04_%E4%B8%89%E7%82%B9%E9%92%9F%E7%9A%84%E9%87%8D%E9%87%8F_The_Weight_of_Three_OClock.mp3",
    story:"Three o'clock — the hour of greatest stillness. Energy at its lowest. The light has moved past the floor. The room is quiet in a different way now — not morning quiet, which is fresh, but afternoon quiet, which has settled. The heaviest piece on the album." },
  { num:"04", zh:"四点的对话", en:"Conversations at Four", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T05_%E5%9B%9B%E7%82%B9%E7%9A%84%E5%AF%B9%E8%AF%9D_Conversations_at_Four.mp3",
    story:"Something stirs. A thought, or the memory of a voice, or simply the guitar playing to itself. It is not quite a conversation — there is only one guitar — but the phrase shapes suggest call and withdrawal, something offered and something held back." },
  { num:"05", zh:"最后的光", en:"Last Light On the Floor", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T06_%E6%9C%80%E5%90%8E%E7%9A%84%E5%85%89_Last_Light_On_The_Floor.mp3",
    story:"Evening. The light returns to the floor one last time, lower now, longer-angled, orange at the edges. Then it goes. The guitar does not chase it. The album closes without ceremony, because ordinary days do not end with ceremony. They simply end." },
  { num:"06", zh:"茶未凉", en:"Before the Tea Cools", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T01_%E8%8C%B6%E6%9C%AA%E5%87%89_Before_the_Tea_Cools.mp3",
    story:"Morning. The tea is still hot — just barely. No one has drunk it yet. The room is quiet with the specific quiet of early hours: unhurried, without expectation. The day has not begun. C major. The softest piece on the album." }
];
let current=0; const audio=document.getElementById('audio');
function fmt(s){if(isNaN(s))return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
function buildSidebar(){const sb=document.getElementById('sidebar');tracks.forEach((t,i)=>{const el=document.createElement('div');el.className='track-item'+(i===0?' active':'');el.id='ti'+i;el.innerHTML=`<div class="track-num">TRACK ${t.num}</div><div class="track-zh">${t.zh}</div><div class="track-en">${t.en}</div>`;el.onclick=()=>loadTrack(i,true);sb.appendChild(el);});}
function loadTrack(idx,play){document.getElementById('ti'+current).classList.remove('active');current=idx;document.getElementById('ti'+current).classList.add('active');const t=tracks[current];document.getElementById('npNum').textContent='TRACK '+t.num;document.getElementById('npZh').textContent=t.zh;document.getElementById('npEn').textContent=t.en;const s=document.getElementById('npStory');s.style.opacity=0;setTimeout(()=>{s.textContent=t.story;s.style.opacity=1;},200);audio.src=t.file;if(play)audio.play();updateBtn();}
function togglePlay(){audio.paused?audio.play():audio.pause();updateBtn();}
function updateBtn(){document.getElementById('btnPlay').innerHTML=audio.paused?'&#9654;':'&#9646;&#9646;';document.getElementById('statusDot').className='status-dot'+(audio.paused?'':' playing');}
function prevTrack(){if(audio.currentTime>3){audio.currentTime=0;return;}loadTrack((current-1+tracks.length)%tracks.length,!audio.paused);}
function nextTrack(){loadTrack((current+1)%tracks.length,!audio.paused);}
audio.addEventListener('timeupdate',()=>{if(!audio.duration)return;document.getElementById('progressFill').style.width=(audio.currentTime/audio.duration*100)+'%';document.getElementById('timeElapsed').textContent=fmt(audio.currentTime);document.getElementById('timeTotal').textContent=fmt(audio.duration);});
audio.addEventListener('ended',()=>{if(current<tracks.length-1)loadTrack(current+1,true);else updateBtn();});
audio.addEventListener('play',updateBtn);audio.addEventListener('pause',updateBtn);
document.getElementById('progressBar').addEventListener('click',e=>{if(!audio.duration)return;const r=e.currentTarget.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;});
buildSidebar();loadTrack(0,false);
</script>
  <div class="footer">&copy; 2026 Gem Lee &nbsp;&middot;&nbsp; nongming66@gmail.com &nbsp;&middot;&nbsp; All rights reserved</div>
</body>
</html>
