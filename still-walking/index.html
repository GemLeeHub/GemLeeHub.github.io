<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步履不停 — Still Walking</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #100b05;
    color: #e0d0b0;
    font-family: 'Georgia', 'STSong', serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    padding: 24px 40px 18px;
    border-bottom: 1px solid #241808;
    flex-shrink: 0;
  }
  .album-title { font-size: 26px; font-weight: normal; letter-spacing: 0.12em; color: #f0e0c0; }
  .album-subtitle { font-size: 12px; color: #6a5030; margin-top: 5px; letter-spacing: 0.1em; }

  .body { display: flex; flex: 1; overflow: hidden; }

  .sidebar {
    width: 230px;
    border-right: 1px solid #241808;
    overflow-y: auto;
    flex-shrink: 0;
    padding: 12px 0;
  }
  .track-item {
    padding: 10px 20px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.2s;
  }
  .track-item:hover { background: #1c1208; }
  .track-item.active { border-left-color: #c87820; background: #181008; }
  .track-num { font-size: 9px; color: #6a5030; letter-spacing: 0.12em; margin-bottom: 2px; }
  .track-zh { font-size: 15px; color: #e0d0b0; letter-spacing: 0.05em; }
  .track-en { font-size: 10px; color: #6a5030; margin-top: 1px; }
  .track-item.active .track-zh { color: #c87820; }
  .track-item.active .track-en { color: #a06018; }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 40px 50px 30px;
  }
  .now-playing { flex: 1; overflow-y: auto; }
  .np-number { font-size: 10px; color: #6a5030; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 14px; }
  .np-zh { font-size: 50px; font-weight: normal; color: #f0e0c0; letter-spacing: 0.08em; line-height: 1; margin-bottom: 10px; }
  .np-en { font-size: 16px; color: #907050; letter-spacing: 0.1em; margin-bottom: 34px; }
  .np-story { font-size: 14px; line-height: 1.9; color: #a08860; max-width: 540px; transition: opacity 0.4s ease; }

  .controls { flex-shrink: 0; padding-top: 26px; border-top: 1px solid #241808; }
  .progress-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .time { font-size: 10px; color: #6a5030; width: 38px; flex-shrink: 0; }
  .time.right { text-align: right; }
  .progress-bar { flex: 1; height: 2px; background: #241808; border-radius: 2px; cursor: pointer; }
  .progress-fill { height: 100%; background: #c87820; border-radius: 2px; width: 0%; transition: width 0.5s linear; pointer-events: none; }
  .buttons { display: flex; align-items: center; gap: 26px; }
  .btn { background: none; border: none; color: #6a5030; cursor: pointer; font-size: 12px; letter-spacing: 0.1em; padding: 5px 0; transition: color 0.2s; }
  .btn:hover { color: #c87820; }
  .btn-play { font-size: 14px; color: #e0d0b0; border: 1px solid #382010; border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .btn-play:hover { border-color: #c87820; color: #c87820; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #c87820; opacity: 0; transition: opacity 0.3s; margin-left: auto; }
  .status-dot.playing { opacity: 1; }
  .footer { text-align: center; font-size: 9px; color: #2a2820; letter-spacing: 0.1em; padding: 10px 0 14px; flex-shrink: 0; }
  @media (max-width: 768px) {
    body { height: auto; min-height: 100dvh; overflow: auto; }
    .header { padding: 16px 20px 12px; }
    .album-title { font-size: 20px; letter-spacing: 0.08em; }
    .album-subtitle { font-size: 10px; }
    .body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; border-right: none; display: flex; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 6px 0 6px; flex-shrink: 0; -webkit-overflow-scrolling: touch; }
    .track-item { flex-shrink: 0; padding: 8px 16px; border-left: none; border-bottom: 2px solid transparent; }
    .track-item.active { border-left: none; border-bottom-color: currentColor; background: none; }
    .track-num { font-size: 8px; margin-bottom: 2px; }
    .track-zh { font-size: 12px; white-space: nowrap; }
    .track-en { display: none; }
    .main { padding: 24px 20px 16px; }
    .np-number { margin-bottom: 8px; }
    .np-zh { font-size: 30px; margin-bottom: 6px; }
    .np-en { font-size: 10px; margin-bottom: 18px; letter-spacing: 0.18em; }
    .np-story { font-size: 13px; line-height: 1.9; max-width: 100%; }
    .controls { padding-top: 16px; }
    .progress-wrap { margin-bottom: 12px; }
    .buttons { gap: 16px; }
    .btn-play { width: 44px; height: 44px; }
    .footer { font-size: 8px; padding: 8px 16px 12px; }
    .mantra { font-size: 10px; }
  }
</style>
</head>
<body>
<div class="header">
  <div class="album-title">步履不停 &nbsp;·&nbsp; Still Walking</div>
  <div class="album-subtitle">Lee Jin &nbsp;&nbsp;·&nbsp;&nbsp; 2026</div>
</div>
<div class="body">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="now-playing">
      <div class="np-number" id="npNum">TRACK 01</div>
      <div class="np-zh" id="npZh">珍</div>
      <div class="np-en" id="npEn">Gem</div>
      <div class="np-story" id="npStory"></div>
    </div>
    <div class="controls">
      <div class="progress-wrap">
        <span class="time" id="timeElapsed">0:00</span>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="time right" id="timeTotal">0:00</span>
        <div class="status-dot" id="statusDot"></div>
      </div>
      <div class="buttons">
        <button class="btn" onclick="prevTrack()">&#9664;&#9664; PREV</button>
        <button class="btn btn-play" id="btnPlay" onclick="togglePlay()">&#9654;</button>
        <button class="btn" onclick="nextTrack()">NEXT &#9654;&#9654;</button>
      </div>
    </div>
  </div>
</div>
<audio id="audio"></audio>
<script>
const tracks = [
  { num:"01", zh:"珍", en:"Gem", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T01_%E7%8F%8D_Gem.mp3",
    story:"What opens the album is the thing that can't be named yet — the gem you didn't know you were looking for. The opening piece asks: what was precious about those years? The answer takes six more tracks." },
  { num:"02", zh:"学生", en:"Student", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T02_%E5%AD%A6%E7%94%9F_Student.mp3",
    story:"The most breathing piece on the album. The student is not sure yet. The silences are the uncertainty — the pauses before speaking, the gaps between what you know and what you're reaching toward." },
  { num:"03", zh:"先生", en:"Teacher", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T03_%E5%85%88%E7%94%9F_Teacher.mp3",
    story:"Measured, deliberate. The teacher does not hurry. What the teacher gives is not information but a way of holding things." },
  { num:"04", zh:"那棵树", en:"Tree", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T04_%E9%82%A3%E6%A3%B5%E6%A0%91_Tree.mp3",
    story:"The tree that stood at the edge of the path every day for four years. You stopped noticing it. And then one day you didn't need to notice it — it was already inside you." },
  { num:"05", zh:"东京咖啡馆", en:"Coffee Shop in Tokyo", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T05_%E4%B8%9C%E4%BA%AC%E5%92%96%E5%95%A1%E9%A6%86_Coffee_Shop_in_Tokyo.mp3",
    story:"The outlier. A coffee shop in Tokyo is not campus — it is the horizon campus makes possible. The self that was formed in those years, sitting somewhere far from where it was formed, still walking." },
  { num:"06", zh:"大地", en:"Earth", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T06_%E5%A4%A7%E5%9C%B0_Earth.mp3",
    story:"The earth is not sentimental. It does not remember you. It holds you anyway. The campus, the teacher, the tree, the gem, the coffee shop — all of it resting on the same ground." },
  { num:"07", zh:"赠己", en:"Lee", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T07_%E8%B5%A0%E5%B7%B1_Lee.mp3",
    story:"The final piece. The only one named for the maker himself — a gift to oneself. The most continuous piece on the album: no hesitation, no gaps. The world has been walked. Now there is only this." }
];
let current=0; const audio=document.getElementById('audio');
function fmt(s){if(isNaN(s))return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
function buildSidebar(){const sb=document.getElementById('sidebar');tracks.forEach((t,i)=>{const el=document.createElement('div');el.className='track-item'+(i===0?' active':'');el.id='ti'+i;el.innerHTML=`<div class="track-num">TRACK ${t.num}</div><div class="track-zh">${t.zh}</div><div class="track-en">${t.en}</div>`;el.onclick=()=>loadTrack(i,true);sb.appendChild(el);});}
function loadTrack(idx,play){document.getElementById('ti'+current).classList.remove('active');current=idx;document.getElementById('ti'+current).classList.add('active');const t=tracks[current];document.getElementById('npNum').textContent='TRACK '+t.num;document.getElementById('npZh').textContent=t.zh;document.getElementById('npEn').textContent=t.en;const s=document.getElementById('npStory');s.style.opacity=0;setTimeout(()=>{s.textContent=t.story;s.style.opacity=1;},200);audio.src=t.file;if(play)audio.play();updateBtn();}
function togglePlay(){audio.paused?audio.play():audio.pause();updateBtn();}
function updateBtn(){document.getElementById('btnPlay').innerHTML=audio.paused?'&#9654;':'&#9646;&#9646;';document.getElementById('statusDot').className='status-dot'+(audio.paused?'':' playing');}
function prevTrack(){if(audio.currentTime>3){audio.currentTime=0;return;}loadTrack((current-1+tracks.length)%tracks.length,!audio.paused);}
function nextTrack(){loadTrack((current+1)%tracks.length,!audio.paused);}
audio.addEventListener('timeupdate',()=>{if(!audio.duration)return;document.getElementById('progressFill').style.width=(audio.currentTime/audio.duration*100)+'%';document.getElementById('timeElapsed').textContent=fmt(audio.currentTime);document.getElementById('timeTotal').textContent=fmt(audio.duration);});
audio.addEventListener('ended',()=>{if(current<tracks.length-1)loadTrack(current+1,true);else updateBtn();});
audio.addEventListener('play',updateBtn);audio.addEventListener('pause',updateBtn);
document.getElementById('progressBar').addEventListener('click',e=>{if(!audio.duration)return;const r=e.currentTarget.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;});
buildSidebar();loadTrack(0,false);
</script>
  <div class="footer">&copy; 2026 Gem Lee &nbsp;&middot;&nbsp; nongming66@gmail.com &nbsp;&middot;&nbsp; All rights reserved</div>
</body>
</html>
