<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滚动 — Rolling · Gem Lee</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicAlbum",
  "name": "滚动 — Rolling",
  "byArtist": { "@type": "MusicGroup", "name": "Gem Lee" },
  "genre": "Jazz Instrumental",
  "license": "https://creativecommons.org/licenses/by-nc-nd/4.0/",
  "copyrightYear": "2026",
  "copyrightHolder": { "@type": "Person", "name": "Gem Lee", "email": "nongming66@gmail.com" }
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @keyframes sway {
    0%,100% { transform: rotate(-0.5deg) scale(1.02); }
    50%     { transform: rotate(0.5deg)  scale(1.02); }
  }

  body {
    background: #1a1008;
    color: #f0e8d0;
    font-family: 'Georgia', 'STSong', serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .bg-image {
    position: fixed;
    inset: -6%;
    z-index: 0;
    background-image: url('./cover.png');
    background-size: cover;
    background-position: center center;
    animation: sway 7s ease-in-out infinite;
    transform-origin: bottom center;
    pointer-events: none;
  }

  .bg-overlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: rgba(10, 6, 2, 0.72);
    pointer-events: none;
  }

  .back-link {
    position: fixed; top: 18px; right: 22px; z-index: 10;
    font-size: 9px; letter-spacing: 0.22em;
    color: #d4a840; text-decoration: none; text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
    transition: color 0.2s;
  }
  .back-link:hover { color: #ffffff; }

  .header { padding: 22px 40px 18px; flex-shrink: 0; position: relative; z-index: 1; }
  .album-title { font-size: 26px; font-weight: normal; letter-spacing: 0.12em; color: #ffffff; text-shadow: 0 1px 12px rgba(0,0,0,0.95); }
  .album-subtitle { font-size: 12px; color: #d4a840; margin-top: 5px; letter-spacing: 0.1em; text-shadow: 0 1px 8px rgba(0,0,0,0.9); }

  .body { display: flex; flex: 1; overflow: hidden; position: relative; z-index: 1; }

  .sidebar { width: 230px; overflow-y: auto; flex-shrink: 0; padding: 12px 0; }
  .track-item { padding: 8px 20px; cursor: pointer; transition: opacity 0.2s; }
  .track-item:hover { opacity: 0.7; }
  .track-num { font-size: 9px; letter-spacing: 0.2em; color: #d4a840; margin-bottom: 3px; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .track-zh { font-size: 13px; color: #ffffff; margin-bottom: 2px; text-shadow: 0 1px 8px rgba(0,0,0,0.95); }
  .track-en { font-size: 10px; color: #c09050; letter-spacing: 0.06em; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .track-item.active .track-zh { color: #f8e8b0; }
  .track-item.active .track-en { color: #d4a840; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 36px 52px 28px; }
  .now-playing { flex: 1; overflow-y: auto; }
  .np-number { font-size: 10px; letter-spacing: 0.35em; color: #d4a840; margin-bottom: 12px; text-shadow: 0 1px 8px rgba(0,0,0,0.9); }
  .np-zh { font-size: 48px; font-weight: normal; letter-spacing: 0.08em; color: #ffffff; margin-bottom: 8px; line-height: 1.1; text-shadow: 0 2px 16px rgba(0,0,0,0.95); }
  .np-en { font-size: 12px; letter-spacing: 0.28em; color: #d4a840; text-transform: uppercase; margin-bottom: 28px; text-shadow: 0 1px 10px rgba(0,0,0,0.95); }
  .np-story { font-size: 14px; line-height: 2.1; color: #e0d0a8; max-width: 500px; transition: opacity 0.4s ease; text-shadow: 0 1px 10px rgba(0,0,0,0.95); }

  .controls { flex-shrink: 0; padding-top: 22px; position: relative; z-index: 1; }
  .progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .time { font-size: 10px; letter-spacing: 0.12em; color: #d4a840; width: 36px; flex-shrink: 0; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .time.right { text-align: right; }
  .progress-bar { flex: 1; height: 1px; background: rgba(212,168,64,0.35); cursor: pointer; }
  .progress-fill { height: 100%; background: #d4a840; width: 0%; transition: width 0.25s linear; }
  .buttons { display: flex; align-items: center; gap: 20px; }
  .btn { background: none; border: none; color: #d4a840; cursor: pointer; font-size: 11px; letter-spacing: 0.18em; padding: 4px 0; transition: color 0.2s; font-family: inherit; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .btn:hover { color: #ffffff; }
  .btn-play { font-size: 14px; color: #ffffff; border: 1px solid rgba(212,168,64,0.5); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .btn-play:hover { border-color: #d4a840; color: #d4a840; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #d4a840; opacity: 0; transition: opacity 0.3s; margin-left: auto; }
  .status-dot.playing { opacity: 1; }

  .footer { text-align: center; font-size: 9px; color: #907050; letter-spacing: 0.1em; padding: 7px 20px 12px; flex-shrink: 0; line-height: 2.2; position: relative; z-index: 1; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .footer a { color: #907050; text-decoration: none; }
  .footer .wangu { font-family: 'STSong','SimSun',serif; font-size: 11px; letter-spacing: 0.2em; color: #c09860; display: block; margin-bottom: 2px; }

  @media (max-width: 768px) {
    body { height: auto; min-height: 100dvh; overflow: auto; }
    .header { padding: 16px 20px 12px; }
    .album-title { font-size: 20px; }
    .body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; display: flex; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 6px 0; flex-shrink: 0; -webkit-overflow-scrolling: touch; }
    .track-item { flex-shrink: 0; padding: 8px 16px; }
    .track-en { display: none; }
    .main { padding: 24px 20px 16px; }
    .np-zh { font-size: 32px; }
    .np-en { font-size: 10px; margin-bottom: 18px; }
    .np-story { font-size: 13px; max-width: 100%; }
    .footer { font-size: 8px; }
  }
</style>
</head>
<body>

<div class="bg-image"></div>
<div class="bg-overlay"></div>
<a class="back-link" href="/">← HUB</a>

<div class="header">
  <div class="album-title">滚动 &nbsp;·&nbsp; Rolling</div>
  <div class="album-subtitle">Gem Lee &nbsp;&nbsp;·&nbsp;&nbsp; Working Music Three &nbsp;&nbsp;·&nbsp;&nbsp; 2026</div>
</div>

<div class="body">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="now-playing">
      <div class="np-number" id="npNum">TRACK 01</div>
      <div class="np-zh" id="npZh">桌上那杯茶</div>
      <div class="np-en" id="npEn">Tea on the Desk</div>
      <div class="np-story" id="npStory"></div>
    </div>
    <div class="controls">
      <div class="progress-wrap">
        <span class="time" id="timeElapsed">0:00</span>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="time right" id="timeTotal">0:00</span>
        <div class="status-dot" id="statusDot"></div>
      </div>
      <div class="buttons">
        <button class="btn" onclick="prevTrack()">&#9664;&#9664; PREV</button>
        <button class="btn btn-play" id="btnPlay" onclick="togglePlay()">&#9654;</button>
        <button class="btn" onclick="nextTrack()">NEXT &#9654;&#9654;</button>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  <span class="wangu">万古长空，一朝风月.</span>
  &copy; 2026 Gem Lee &nbsp;&middot;&nbsp;
  <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/" target="_blank">CC BY-NC-ND 4.0</a>
  &nbsp;&middot;&nbsp; Non-commercial use free with attribution &nbsp;&middot;&nbsp;
  Commercial use: <a href="mailto:nongming66@gmail.com">nongming66@gmail.com</a>
  &nbsp;&middot;&nbsp; Fees donated to Dharma Drum Mountain (法鼓山)
</div>

<audio id="audio"></audio>
<script>
const tracks = [
  { num:"01", zh:"桌上那杯茶", en:"Tea on the Desk",
    file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T3-Midnight_in_the_Study.mp3",
    story:"Piano, guitar, bass — all three from the first phrase. A cup of tea on the desk. The afternoon has already begun." },
  { num:"02", zh:"天气很好", en:"Good Weather",
    file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T2-Conversations_in_Oak.mp3",
    story:"A four-note phrase that keeps returning. Something quietly lifts." },
  { num:"03", zh:"窗外的光", en:"The Light Through the Window",
    file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T3-First_Light_in_the_Library.mp3",
    story:"Just piano and guitar. The bass is gone. The music opens." },
  { num:"04", zh:"有风", en:"There's a Breeze",
    file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T4-A_Letter_To_The_Afternoon.mp3",
    story:"The bass returns. A breeze means something is moving." },
  { num:"05", zh:"随便走走", en:"Just Walking",
    file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T5-Window_Left_Open.mp3",
    story:"Light on its feet, going nowhere in particular — which is not nothing. It's freedom." },
  { num:"06", zh:"心里在跳", en:"Dancing Inside",
    file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T6-Before_the_Streets_Wake_Up.mp3",
    story:"Brush drums enter for the first time. They don't announce themselves. Something was already dancing." },
  { num:"07", zh:"没什么事", en:"Nothing Much",
    file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T7-Sunlight_in_the_Room.mp3",
    story:"The piano alone. Left hand rolls upward, slowly, one chord at a time. Nothing is happening. That is enough." },
  { num:"08", zh:"一点点", en:"Just a Little",
    file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T8-Sunlight_on_the_Floor.mp3",
    story:"Guitar and piano, briefly. A small thought that passes through." },
  { num:"09", zh:"就这样吧", en:"Let's Just Stay",
    file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T9-A_Room_at_Noon.mp3",
    story:"The trio returns. The bass grounds it. This is fine. This is enough." },
  { num:"10", zh:"不知道", en:"Don't Know",
    file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T10-Sunlight_on_the_Floorboards.mp3",
    story:"The piano alone again. The light is still there. No answer required." },
  { num:"11", zh:"还好还好", en:"All Fine",
    file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/T11-Late_Sunday_Light.mp3",
    story:"Three voices, all back. Something has returned that was not missing, only quiet." },
];

let current=0;
const audio=document.getElementById('audio');

function fmt(s){if(isNaN(s))return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}

function buildSidebar(){
  const sb=document.getElementById('sidebar');
  tracks.forEach((t,i)=>{
    const el=document.createElement('div');
    el.className='track-item'+(i===0?' active':'');
    el.id='ti'+i;
    el.innerHTML=`<div class="track-num">TRACK ${t.num}</div><div class="track-zh">${t.zh}</div><div class="track-en">${t.en}</div>`;
    el.onclick=()=>loadTrack(i,true);
    sb.appendChild(el);
  });
}

function loadTrack(idx,play){
  document.getElementById('ti'+current).classList.remove('active');
  current=idx;
  document.getElementById('ti'+current).classList.add('active');
  const t=tracks[current];
  document.getElementById('npNum').textContent='TRACK '+t.num;
  document.getElementById('npZh').textContent=t.zh;
  document.getElementById('npEn').textContent=t.en;
  const s=document.getElementById('npStory');
  s.style.opacity=0;
  setTimeout(()=>{s.textContent=t.story;s.style.opacity=1;},200);
  audio.src=t.file;
  if(play)audio.play();
  updateBtn();
}

function togglePlay(){audio.paused?audio.play():audio.pause();updateBtn();}
function updateBtn(){
  document.getElementById('btnPlay').innerHTML=audio.paused?'&#9654;':'&#9646;&#9646;';
  document.getElementById('statusDot').className='status-dot'+(audio.paused?'':' playing');
}
function prevTrack(){if(audio.currentTime>3){audio.currentTime=0;return;}loadTrack((current-1+tracks.length)%tracks.length,!audio.paused);}
function nextTrack(){loadTrack((current+1)%tracks.length,!audio.paused);}

audio.addEventListener('timeupdate',()=>{
  if(!audio.duration)return;
  document.getElementById('progressFill').style.width=(audio.currentTime/audio.duration*100)+'%';
  document.getElementById('timeElapsed').textContent=fmt(audio.currentTime);
  document.getElementById('timeTotal').textContent=fmt(audio.duration);
});
audio.addEventListener('ended',()=>{if(current<tracks.length-1)loadTrack(current+1,true);else updateBtn();});
audio.addEventListener('play',updateBtn);
audio.addEventListener('pause',updateBtn);
document.getElementById('progressBar').addEventListener('click',e=>{
  if(!audio.duration)return;
  const r=e.currentTarget.getBoundingClientRect();
  audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
});

buildSidebar();
loadTrack(0,false);
</script>
</body>
</html>
