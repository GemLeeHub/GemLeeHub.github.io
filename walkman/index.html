let plIndex=0, current=0, shuffle=false, loopAll=true, info=false;
const audio=document.getElementById('audio');
const pad=n=>String(n).padStart(2,'0');
const fmt=s=>isNaN(s)?'0:00':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const PL=()=>playlists[plIndex];

function buildPlaylists(){
  const g=document.getElementById('plGrid'); g.innerHTML='';
  playlists.forEach((p,i)=>{
    const el=document.createElement('button');
    el.className='pl-item'+(i===plIndex?' active':'')+(p.soon?' soon':'');
    el.innerHTML=`<div><div class="pl-zh">${p.zh} · ${p.en}</div><div class="pl-en">${p.soon?'即将推出':'In Order / Shuffle'}</div></div><div class="pl-meta">${p.soon?'soon':p.tracks.length+' tracks'}</div>`;
    if(!p.soon) el.onclick=()=>selectPlaylist(i);
    g.appendChild(el);
  });
}
function selectPlaylist(i){
  if(playlists[i].soon) return;
  plIndex=i; current=0;
  document.getElementById('screenPl').textContent=PL().zh+' · '+PL().en;
  document.getElementById('screenMood').textContent=PL().mood;
  buildPlaylists();
  load(0,false);
}

function load(idx,play){
  current=idx;
  const t=PL().tracks[current];
  document.getElementById('npNum').textContent='TRACK '+pad(current+1)+' / '+PL().tracks.length;
  document.getElementById('npZh').textContent=t.zh;
  document.getElementById('npEn').textContent=t.en;
  document.getElementById('npNote').textContent=t.note||'';
  audio.src=t.file;
  if(play)audio.play();
  setMS(t);
  updateBtn();
}
function setMS(t){
  if(!('mediaSession' in navigator))return;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({
      title: t.zh + (t.en ? '  ·  '+t.en : ''),
      artist: 'Gem Lee',
      album: '随身听 · Walkman — '+PL().zh+' '+PL().en
    });
  }catch(e){}
}
function toggle(){audio.paused?audio.play():audio.pause();updateBtn();}
function updateBtn(){
  document.getElementById('btnPlay').innerHTML=audio.paused?'&#9654;':'&#9646;&#9646;';
  if('mediaSession' in navigator) navigator.mediaSession.playbackState=audio.paused?'paused':'playing';
}
function stop(){audio.pause();audio.currentTime=0;updateBtn();}
function prev(){if(audio.currentTime>3){audio.currentTime=0;return;}load((current-1+PL().tracks.length)%PL().tracks.length,!audio.paused);}
function next(manual){
  const n=PL().tracks.length;
  if(shuffle){ let r=current; if(n>1){while(r===current)r=Math.floor(Math.random()*n);} load(r,true); return; }
  if(current<n-1) load(current+1,true);
  else if(loopAll) load(0,true);        // playlist end + loop on → restart and play
  else if(manual) load(0,true);         // manual Next at end → wrap and play
  else { audio.pause(); updateBtn(); }  // auto-end + loop off → stop
}
function toggleShuffle(){shuffle=!shuffle;document.getElementById('mShuffle').classList.toggle('on',shuffle);document.getElementById('modeLabel').textContent=shuffle?'Shuffle':'In Order';}
function toggleLoop(){loopAll=!loopAll;document.getElementById('mLoop').classList.toggle('on',loopAll);}
function toggleInfo(){info=!info;document.getElementById('mInfo').classList.toggle('on',info);document.getElementById('npNote').classList.toggle('show',info);}

audio.addEventListener('timeupdate',()=>{
  if(!audio.duration)return;
  document.getElementById('pFill').style.width=(audio.currentTime/audio.duration*100)+'%';
  document.getElementById('tEl').textContent=fmt(audio.currentTime);
  document.getElementById('tTot').textContent=fmt(audio.duration);
});
audio.addEventListener('ended',()=>next(false));
audio.addEventListener('play',updateBtn);
audio.addEventListener('pause',updateBtn);
document.getElementById('pBar').addEventListener('click',e=>{
  if(!audio.duration)return;
  const r=e.currentTarget.getBoundingClientRect();
  audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;
});

if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play',()=>{audio.play();updateBtn();});
  navigator.mediaSession.setActionHandler('pause',()=>{audio.pause();updateBtn();});
  navigator.mediaSession.setActionHandler('previoustrack',()=>prev());
  navigator.mediaSession.setActionHandler('nexttrack',()=>next(true));
}

buildPlaylists();
load(0,false);
</script>
