<head>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicAlbum",
  "name": "树 · Trees",
  "byArtist": { "@type": "MusicGroup", "name": "Gem Lee" },

  "license": "https://creativecommons.org/licenses/by-nc-nd/4.0/",

  "copyrightHolder": { "@type": "Person", "name": "Gem Lee", "email": "nongming66@gmail.com" },
  "description": "Concept, direction and prompts by Gem Lee. Audio synthesized via AI (Gemini Lyria). Seven observations from a walk through old-growth forest."
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #04100f;
    color: #b8d8d4;
    font-family: 'Georgia', 'STSong', serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .bg-image {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url('./cover.png');
    background-size: cover;
    background-position: center center;
    pointer-events: none;
  }

  .bg-overlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: rgba(4, 16, 12, 0.52);
    pointer-events: none;
  }

  .back-link {
    position: fixed; top: 18px; right: 22px; z-index: 10;
    font-size: 9px; letter-spacing: 0.22em;
    color: #2ab8a0; text-decoration: none; text-transform: uppercase;
    text-shadow: 0 1px 8px rgba(0,0,0,0.95);
    transition: color 0.2s;
  }
  .back-link:hover { color: #ffffff; }

  .header { padding: 22px 40px 18px; flex-shrink: 0; position: relative; z-index: 1; }
  .album-title { font-size: 26px; font-weight: normal; letter-spacing: 0.12em; color: #e0f0ec; text-shadow: 0 1px 12px rgba(0,0,0,0.95), 0 0 40px rgba(0,0,0,0.7); }
  .album-subtitle { font-size: 12px; color: #2ab8a0; margin-top: 5px; letter-spacing: 0.1em; text-shadow: 0 1px 8px rgba(0,0,0,0.9); }

  .body { display: flex; flex: 1; overflow: hidden; position: relative; z-index: 1; }

  .sidebar { width: 230px; overflow-y: auto; flex-shrink: 0; padding: 12px 0; }
  .track-item { padding: 9px 20px; cursor: pointer; transition: opacity 0.2s; }
  .track-item:hover { opacity: 0.7; }
  .track-num { font-size: 9px; letter-spacing: 0.2em; color: #2ab8a0; margin-bottom: 3px; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .track-zh { font-size: 14px; color: #e0f0ec; margin-bottom: 2px; text-shadow: 0 1px 8px rgba(0,0,0,0.95); }
  .track-en { font-size: 10px; color: #2ab8a0; letter-spacing: 0.05em; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .track-item.active .track-zh { color: #ffffff; }
  .track-item.active .track-en { color: #5ed8c0; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 36px 52px 28px; }
  .now-playing { flex: 1; overflow-y: auto; }
  .np-number { font-size: 10px; letter-spacing: 0.35em; color: #2ab8a0; margin-bottom: 12px; text-shadow: 0 1px 8px rgba(0,0,0,0.9); }
  .np-zh { font-size: 50px; font-weight: normal; letter-spacing: 0.08em; color: #ffffff; margin-bottom: 8px; line-height: 1.1; text-shadow: 0 2px 16px rgba(0,0,0,0.95), 0 0 60px rgba(0,0,0,0.5); }
  .np-en { font-size: 12px; letter-spacing: 0.28em; color: #4ab8a8; text-transform: uppercase; margin-bottom: 28px; text-shadow: 0 1px 10px rgba(0,0,0,0.95); }
  .np-story { font-size: 14px; line-height: 2.1; color: #b8d8d4; max-width: 520px; transition: opacity 0.4s ease; text-shadow: 0 1px 10px rgba(0,0,0,0.95); }

  .controls { flex-shrink: 0; padding-top: 22px; position: relative; z-index: 1; }
  .progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .time { font-size: 10px; letter-spacing: 0.12em; color: #2ab8a0; width: 36px; flex-shrink: 0; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .time.right { text-align: right; }
  .progress-bar { flex: 1; height: 1px; background: rgba(42,184,160,0.25); cursor: pointer; }
  .progress-fill { height: 100%; background: #2ab8a0; width: 0%; transition: width 0.25s linear; }
  .buttons { display: flex; align-items: center; gap: 20px; }
  .btn { background: none; border: none; color: #2ab8a0; cursor: pointer; font-size: 11px; letter-spacing: 0.18em; padding: 4px 0; transition: color 0.2s; font-family: inherit; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .btn:hover { color: #ffffff; }
  .btn-play { font-size: 14px; color: #ffffff; border: 1px solid rgba(42,184,160,0.5); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .btn-play:hover { border-color: #2ab8a0; color: #2ab8a0; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #2ab8a0; box-shadow: 0 0 6px 2px rgba(42,184,160,0.5); opacity: 0; transition: opacity 0.3s; margin-left: auto; }
  .status-dot.playing { opacity: 1; }

  .footer { text-align: center; font-size: 9px; color: #2a6058; letter-spacing: 0.1em; padding: 7px 20px 10px; flex-shrink: 0; line-height: 2; position: relative; z-index: 1; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .footer a { color: #2a6058; text-decoration: none; }

  @media (max-width: 768px) {
    body { height: auto; min-height: 100dvh; overflow: auto; }
    .header { padding: 16px 20px 12px; }
    .album-title { font-size: 20px; }
    .album-subtitle { font-size: 10px; }
    .body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; display: flex; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 6px 0; flex-shrink: 0; -webkit-overflow-scrolling: touch; }
    .track-item { flex-shrink: 0; padding: 8px 16px; }
    .track-en { display: none; }
    .main { padding: 24px 20px 16px; }
    .np-zh { font-size: 32px; }
    .np-en { font-size: 10px; margin-bottom: 18px; }
    .np-story { font-size: 13px; max-width: 100%; }
    .footer { font-size: 8px; }
  }
</style>
</head>
<body>

<div class="bg-image"></div>
<div class="bg-overlay"></div>

<a class="back-link" href="/">&#9666; ALL ALBUMS</a>

<div class="header">
  <div class="album-title">树 &nbsp;Trees</div>
  <div class="album-subtitle">Gem Lee &nbsp;&middot;&nbsp; 2026</div>
</div>

<div class="body">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="now-playing">
      <div class="np-number" id="npNum">TRACK 01</div>
      <div class="np-zh" id="npZh">入林</div>
      <div class="np-en" id="npEn">Stillness in the Pavilion</div>
      <div class="np-story" id="npStory"></div>
    </div>
    <div class="controls">
      <div class="progress-wrap">
        <span class="time" id="timeElapsed">0:00</span>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="time right" id="timeTotal">0:00</span>
        <div class="status-dot" id="statusDot"></div>
      </div>
      <div class="buttons">
        <button class="btn" onclick="prevTrack()">&#9664;&#9664; PREV</button>
        <button class="btn btn-play" id="btnPlay" onclick="togglePlay()">&#9654;</button>
        <button class="btn" onclick="nextTrack()">NEXT &#9654;&#9654;</button>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  &copy; 2026 Gem Lee &nbsp;&middot;&nbsp; <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/" target="_blank">CC BY-NC-ND 4.0</a> &nbsp;&middot;&nbsp; Non-commercial use free with attribution &nbsp;&middot;&nbsp; Commercial use: <a href="mailto:nongming66@gmail.com">nongming66@gmail.com</a> &nbsp;&middot;&nbsp; Fees donated to Dharma Drum Mountain (法鼓山)
  <div style="margin-top:4px; font-size:11px; letter-spacing:0.28em; font-style:italic; color:#2ab8a0; text-shadow:0 1px 8px rgba(0,0,0,0.9);">万古长空，一朝风月</div>
</div>

<audio id="audio"></audio>

<script>
const BASE = 'https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/';
const tracks = [
  { num:"01", zh:"入林", en:"Stillness in the Pavilion",
    file: BASE+'T1-Stillness_in_the_Pavilion.mp3',
    story:"The first steps into the forest. The city is still close — you can feel its noise behind you — but with each footstep, it recedes. Nothing is happening. Everything is present. This is what it feels like before any thought arrives to interpret it." },
  { num:"02", zh:"树的形成", en:"Where the Timber Breathes",
    file: BASE+'T2-Where_the_Timber_Breathes.mp3',
    story:"A tree is not a thing. It is a process. Light becomes leaf. Rain becomes wood. Air becomes branch. Time becomes ring. Two voices arrive from different directions and occasionally, briefly, find themselves at the same moment — not by arrangement, but by the way causes converge. This is how a tree is made." },
  { num:"03", zh:"光", en:"Sunlight Through Leaves",
    file: BASE+'T3-Sunlight_Through_Leaves.mp3',
    story:"A beam of sunlight breaks through the canopy. For a moment, everything that was hidden becomes visible: the air, the moisture, the texture of bark, the geometry of branches. The light did not create these things. It only revealed what was already there. The forest is grateful for the interruption." },
  { num:"04", zh:"不可见的维度", en:"Stone and Breath",
    file: BASE+'T4-Stone_and_Breath.mp3',
    story:"You stand in front of a very old tree and something shifts. The tree has been here for two hundred years. Wind has passed through it. Animals have sheltered under it. People have walked by it without looking. Whatever it has accumulated is not visible and cannot be measured. You are not sure if you are imagining it. You are not imagining it." },
  { num:"05", zh:"绿色", en:"Sunlight on Rosewood",
    file: BASE+'T5-Sunlight_on_Rosewood.mp3',
    story:"There is more green in this forest than anything else. By all logic, it should be monotonous. It is not. Each leaf is a slightly different green — young shoots nearly glowing, old canopy nearly black, everything in between. The same color, expressed at every possible age, simultaneously. The music repeats. It is never the same twice." },
  { num:"06", zh:"心旷神怡", en:"Breath of the Grove",
    file: BASE+'T6-Breath_of_the_Grove.mp3',
    story:"心旷神怡. There is no accurate translation. The mind becomes spacious. The spirit is at ease. Not happiness, not excitement — something quieter and more complete. The forest did not do anything spectacular to cause this. It simply continued to be itself: trees, light, silence, air, time. That was enough. More than enough." },
  { num:"07", zh:"叶公好龙", en:"The Rosewood Pavilion",
    file: BASE+'T7-The_Rosewood_Pavilion.mp3',
    story:"叶公好龙: the man who loved dragons until a real one appeared. You walked into the forest full of curiosity and wonder. When you were genuinely lost, you wanted your car. Both things were true at the same time. The forest is still there behind you. The call of it is already fading. You are, after all, exactly this kind of person. That is fine." }
];

let current = 0;
const audio = document.getElementById('audio');

function fmt(s) { if(isNaN(s) || !isFinite(s)) return '0:00'; return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }

function buildSidebar() {
  const sb = document.getElementById('sidebar');
  tracks.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'track-item' + (i === 0 ? ' active' : '');
    el.id = 'ti' + i;
    el.innerHTML = `<div class="track-num">TRACK ${t.num}</div><div class="track-zh">${t.zh}</div><div class="track-en">${t.en}</div>`;
    el.onclick = () => loadTrack(i, true);
    sb.appendChild(el);
  });
}

function loadTrack(idx, play) {
  document.getElementById('ti' + current).classList.remove('active');
  current = idx;
  document.getElementById('ti' + current).classList.add('active');
  const t = tracks[current];
  document.getElementById('npNum').textContent = 'TRACK ' + t.num;
  document.getElementById('npZh').textContent = t.zh;
  document.getElementById('npEn').textContent = t.en;
  const s = document.getElementById('npStory');
  s.style.opacity = 0;
  setTimeout(() => { s.textContent = t.story; s.style.opacity = 1; }, 200);
  audio.src = t.file;
  if (play) audio.play();
  updateBtn();
}

function togglePlay() { audio.paused ? audio.play() : audio.pause(); updateBtn(); }
function updateBtn() {
  document.getElementById('btnPlay').innerHTML = audio.paused ? '&#9654;' : '&#9646;&#9646;';
  document.getElementById('statusDot').className = 'status-dot' + (audio.paused ? '' : ' playing');
}
function prevTrack() { if (audio.currentTime > 3) { audio.currentTime = 0; return; } loadTrack((current - 1 + tracks.length) % tracks.length, !audio.paused); }
function nextTrack() { loadTrack((current + 1) % tracks.length, !audio.paused); }

audio.addEventListener('timeupdate', () => {
  if (!audio.duration || !isFinite(audio.duration)) return;
  document.getElementById('progressFill').style.width = (audio.currentTime / audio.duration * 100) + '%';
  document.getElementById('timeElapsed').textContent = fmt(audio.currentTime);
  document.getElementById('timeTotal').textContent = fmt(audio.duration);
});
audio.addEventListener('ended', () => { if (current < tracks.length - 1) loadTrack(current + 1, true); else updateBtn(); });
audio.addEventListener('play', updateBtn);
audio.addEventListener('pause', updateBtn);

document.getElementById('progressBar').addEventListener('click', e => {
  if (!audio.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  audio.currentTime = ((e.clientX - r.left) / r.width) * audio.duration;
});

buildSidebar();
loadTrack(0, false);
</script>
</body>
</html>
