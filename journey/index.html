<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>途中 — Still on the Way</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /*
  ─────────────────────────────────────────────
  COLOR THEME — PROJECT-001 途中 Morning Road
  Transparent UI over wallpaper — silent-friend pattern
  Accent : #b89040  (warm morning gold)
  ─────────────────────────────────────────────
  */

  body {
    background: #100e08;
    color: #e8dcc8;
    font-family: 'Georgia', 'STSong', serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .bg-image {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url('./cover.png');
    background-size: cover;
    background-position: center center;
    opacity: 1;
    pointer-events: none;
  }

  .bg-overlay {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: rgba(0, 0, 0, 0.35);
    pointer-events: none;
  }

  /* ── HEADER ─────────────────────────────────────────── */
  .header { padding: 22px 40px 18px; flex-shrink: 0; position: relative; z-index: 1; }
  .album-title { font-size: 26px; font-weight: normal; letter-spacing: 0.12em; color: #ffffff; text-shadow: 0 1px 12px rgba(0,0,0,0.9), 0 0 40px rgba(0,0,0,0.6); }
  .album-subtitle { font-size: 12px; color: #b89040; margin-top: 5px; letter-spacing: 0.1em; text-shadow: 0 1px 8px rgba(0,0,0,0.9); }

  /* ── BODY ───────────────────────────────────────────── */
  .body { display: flex; flex: 1; overflow: hidden; position: relative; z-index: 1; }

  .sidebar { width: 230px; overflow-y: auto; flex-shrink: 0; padding: 12px 0; }
  .track-item { padding: 10px 20px; cursor: pointer; transition: opacity 0.2s; }
  .track-item:hover { opacity: 0.75; }
  .track-num { font-size: 9px; letter-spacing: 0.2em; color: #b89040; margin-bottom: 3px; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .track-zh { font-size: 14px; color: #ffffff; margin-bottom: 2px; text-shadow: 0 1px 8px rgba(0,0,0,0.95); }
  .track-en { font-size: 10px; color: #907858; letter-spacing: 0.08em; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .track-item.active .track-zh { color: #f8e8c0; }
  .track-item.active .track-en { color: #c8a860; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 40px 50px 28px; }
  .now-playing { flex: 1; overflow-y: auto; }
  .np-number { font-size: 10px; letter-spacing: 0.35em; color: #b89040; margin-bottom: 14px; text-shadow: 0 1px 8px rgba(0,0,0,0.9); }
  .np-zh { font-size: 48px; font-weight: normal; color: #ffffff; letter-spacing: 0.08em; line-height: 1.2; margin-bottom: 10px; text-shadow: 0 2px 16px rgba(0,0,0,0.95), 0 0 60px rgba(0,0,0,0.5); }
  .np-en { font-size: 14px; letter-spacing: 0.22em; color: #b89040; text-transform: uppercase; margin-bottom: 28px; text-shadow: 0 1px 10px rgba(0,0,0,0.95); }
  .np-story { font-size: 14px; line-height: 1.9; color: #ccc0a0; max-width: 540px; font-style: italic; transition: opacity 0.4s ease; text-shadow: 0 1px 10px rgba(0,0,0,0.95); }

  /* ── CONTROLS ───────────────────────────────────────── */
  .controls { flex-shrink: 0; padding-top: 22px; }
  .progress-wrap { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .time { font-size: 10px; letter-spacing: 0.12em; color: #b89040; width: 36px; flex-shrink: 0; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .time.right { text-align: right; }
  .progress-bar { flex: 1; height: 1px; background: rgba(184,144,64,0.3); cursor: pointer; position: relative; }
  .progress-fill { height: 100%; background: #b89040; width: 0%; transition: width 0.25s linear; }
  .buttons { display: flex; align-items: center; gap: 16px; }
  .btn { background: none; border: none; color: #907858; cursor: pointer; font-size: 10px; letter-spacing: 0.25em; padding: 4px 0; font-family: inherit; transition: color 0.2s; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .btn:hover { color: #ffffff; }
  .btn-play { font-size: 16px; color: #ffffff; border: 1px solid rgba(184,144,64,0.6); border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; padding: 0; }
  .btn-play:hover { border-color: #b89040; color: #b89040; }
  .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #b89040; opacity: 0; transition: opacity 0.3s; margin-left: auto; }
  .status-dot.playing { opacity: 1; }

  /* ── FOOTER ─────────────────────────────────────────── */
  .footer { text-align: center; font-size: 9px; color: #907858; letter-spacing: 0.1em; padding: 7px 20px 10px; flex-shrink: 0; line-height: 2; position: relative; z-index: 1; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
  .footer a { color: #907858; text-decoration: none; }
  .mantra { font-size: 11px; color: #b89040; letter-spacing: 0.32em; font-style: italic; margin-top: 3px; text-shadow: 0 1px 10px rgba(0,0,0,0.9); }

  /* ── MOBILE ─────────────────────────────────────────── */
  @media (max-width: 768px) {
    body { height: auto; min-height: 100dvh; overflow: auto; }
    .bg-image { background-attachment: scroll; }
    .header { padding: 16px 20px 12px; }
    .album-title { font-size: 20px; }
    .album-subtitle { font-size: 10px; }
    .body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; display: flex; flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 6px 0; flex-shrink: 0; -webkit-overflow-scrolling: touch; }
    .track-item { flex-shrink: 0; padding: 8px 16px; }
    .track-item.active { border-bottom: 2px solid #b89040; }
    .track-en { display: none; }
    .main { padding: 24px 20px 16px; }
    .np-zh { font-size: 32px; }
    .np-en { font-size: 10px; letter-spacing: 0.18em; margin-bottom: 18px; }
    .np-story { font-size: 13px; }
    .controls { padding-top: 16px; }
    .btn-play { width: 44px; height: 44px; }
  }
</style>
</head>
<body>
<div class="bg-image"></div>
<div class="bg-overlay"></div>
<div class="header">
  <div class="album-title">途中 &nbsp;·&nbsp; Still on the Way</div>
  <div class="album-subtitle">Gem Lee &nbsp;·&nbsp; 2026 &nbsp;·&nbsp; Ambient Folk, Solo Guitar</div>
</div>
<div class="body">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="now-playing">
      <div class="np-number" id="npNum">TRACK 01</div>
      <div class="np-zh" id="npZh">未启</div>
      <div class="np-en" id="npEn">Not Yet</div>
      <div class="np-story" id="npStory"></div>
    </div>
    <div class="controls">
      <div class="progress-wrap">
        <span class="time" id="timeElapsed">0:00</span>
        <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="time right" id="timeTotal">0:00</span>
        <div class="status-dot" id="statusDot"></div>
      </div>
      <div class="buttons">
        <button class="btn" onclick="prevTrack()">&#9664;&#9664; PREV</button>
        <button class="btn btn-play" id="btnPlay" onclick="togglePlay()">&#9654;</button>
        <button class="btn" onclick="nextTrack()">NEXT &#9654;&#9654;</button>
      </div>
    </div>
  </div>
</div>
<audio id="audio"></audio>
<script>
const tracks = [
  { num:"01", zh:"未启", en:"Not Yet", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/1%20%E5%87%BA%E5%8F%91%E5%89%8D.mp3",
    story:"Before leaving, the room holds its breath. Two guitars — one steady, one carrying an arched melody that rises gently toward the 5th degree and returns home. D Major. What is unspoken before setting out. The journey has not yet begun, and in that not-yet, everything is still possible." },
  { num:"02", zh:"候车", en:"Waiting", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/2%20%E5%80%99%E8%BD%A6.mp3",
    story:"A circular phrase that returns to its starting point without arriving anywhere. No harmonic resolution — each phrase ends suspended, open. Time passes; nothing changes. The specific quality of waiting: not passive, not impatient. Simply present, inside the passing." },
  { num:"03", zh:"陌生的街道", en:"Unfamiliar Streets", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/3%20%E9%99%8C%E7%94%9F%E7%9A%84%E8%A1%97%E9%81%93.mp3",
    story:"Solo guitar. Moving through territory without a map. Heavy rubato — the tempo breathes with each phrase, slowing at the held note, resuming forward. The most active piece on the album. Not lost — just unfamiliar, which is different. The street doesn't know you yet." },
  { num:"04", zh:"萍水相逢", en:"Strangers, Just Hi", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/4%20%E8%90%8D%E6%B0%B4%E7%9B%B8%E9%80%A2.mp3",
    story:"Two guitars, each playing its own sparse line. Then once, midway: Guitar B briefly echoes Guitar A's phrase. One bar. Unrepeated. After that, both resume as before, without acknowledgment. This is what strangers are: a brief rhyme between separate melodies." },
  { num:"05", zh:"暮色", en:"Dusk", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/5%20%E6%9A%AE%E8%89%B2.mp3",
    story:"A melody that descends slowly from the first phrase to the last — begins in the upper register and settles downward, phrase by phrase, without return. A natural minor. Nearly static harmony. The descent is the arc. The day does not end with ceremony. It simply ends." },
  { num:"06", zh:"如故", en:"As It Was", file:"https://raw.githubusercontent.com/GemLeeHub/gemlee-music/main/6%20%E5%88%B0%E5%AE%B6.mp3",
    story:"D Major — the same key as 未启. The home phrase, recognized. A section: the threshold crossed, the room known. B section: quieter, more space, the settling after movement. Return to A: the melody again, familiar and complete. The journey closes not with arrival but with recognition." }
];
let current=0; const audio=document.getElementById('audio');
function fmt(s){if(isNaN(s))return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');}
function buildSidebar(){const sb=document.getElementById('sidebar');tracks.forEach((t,i)=>{const el=document.createElement('div');el.className='track-item'+(i===0?' active':'');el.id='ti'+i;el.innerHTML=`<div class="track-num">TRACK ${t.num}</div><div class="track-zh">${t.zh}</div><div class="track-en">${t.en}</div>`;el.onclick=()=>loadTrack(i,true);sb.appendChild(el);});}
function loadTrack(idx,play){document.getElementById('ti'+current).classList.remove('active');current=idx;document.getElementById('ti'+current).classList.add('active');const t=tracks[current];document.getElementById('npNum').textContent='TRACK '+t.num;document.getElementById('npZh').textContent=t.zh;document.getElementById('npEn').textContent=t.en;const s=document.getElementById('npStory');s.style.opacity=0;setTimeout(()=>{s.textContent=t.story;s.style.opacity=1;},200);audio.src=t.file;if(play)audio.play();updateBtn();}
function togglePlay(){audio.paused?audio.play():audio.pause();updateBtn();}
function updateBtn(){document.getElementById('btnPlay').innerHTML=audio.paused?'&#9654;':'&#9646;&#9646;';document.getElementById('statusDot').className='status-dot'+(audio.paused?'':' playing');}
function prevTrack(){if(audio.currentTime>3){audio.currentTime=0;return;}loadTrack((current-1+tracks.length)%tracks.length,!audio.paused);}
function nextTrack(){loadTrack((current+1)%tracks.length,!audio.paused);}
audio.addEventListener('timeupdate',()=>{if(!audio.duration)return;document.getElementById('progressFill').style.width=(audio.currentTime/audio.duration*100)+'%';document.getElementById('timeElapsed').textContent=fmt(audio.currentTime);document.getElementById('timeTotal').textContent=fmt(audio.duration);});
audio.addEventListener('ended',()=>{if(current<tracks.length-1)loadTrack(current+1,true);else updateBtn();});
audio.addEventListener('play',updateBtn);audio.addEventListener('pause',updateBtn);
document.getElementById('progressBar').addEventListener('click',e=>{if(!audio.duration)return;const r=e.currentTarget.getBoundingClientRect();audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;});
buildSidebar();loadTrack(0,false);
</script>

  <div class="mantra">万古长空，一朝风月</div>
</div>
</body>
</html>
